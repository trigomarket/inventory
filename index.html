<style>
/* Trigo market look: the logo's colors, each with one job.
   Blue = counting and the main actions · purple = the order (what to buy) · teal = done or bought ·
   coral = out of stock or danger · yellow = shelf tags and "running low".
   Jost (round and geometric, like the logo's lettering) for titles; Atkinson Hyperlegible for everything you read and count. */
:root {
  --paper: #f2f6fa;
  --sheet: #ffffff;
  --rule: #d5e0eb;
  --ink: #10273d;
  --ink-soft: #546a80;
  --pen: #0d72b7;
  --pen-wash: #e3f0fa;
  --order: #971ddd;
  --order-wash: #f4e8fc;
  --tag: #ffbc00;
  --tag-ink: #10273d;
  --out: #c8391f;
  --out-fill: #ed553b;
  --out-wash: #fde6e1;
  --warn: #855600;
  --warn-wash: #fff2cc;
  --ok: #17776e;
  --ok-fill: #3caea3;
  --ok-wash: #def4f1;
  --scrim: rgb(9 30 48 / 0.45);
  --shadow: rgb(9 30 48 / 0.16);
  --video: #07121c;
  --font-display: "Jost", "Futura", "Century Gothic", "TeX Gyre Adventor", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0b1724;
    --sheet: #112233;
    --rule: #26405a;
    --ink: #e7f0f8;
    --ink-soft: #9cb1c5;
    --pen: #5db3f0;
    --pen-wash: #13304a;
    --order: #c99af2;
    --order-wash: #2b1a40;
    --tag: #ffbc00;
    --tag-ink: #1b1400;
    --out: #ff8b74;
    --out-fill: #ff8b74;
    --out-wash: #3a1c17;
    --warn: #f5c451;
    --warn-wash: #33290f;
    --ok: #5fd0c4;
    --ok-fill: #5fd0c4;
    --ok-wash: #10302d;
    --scrim: rgb(0 0 0 / 0.6);
    --shadow: rgb(0 0 0 / 0.5);
    --video: #02070c;
    color-scheme: dark;
  }
}

[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
}
img { max-width: 100%; }
.wrap {
  box-sizing: border-box;
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
button, label, a { -webkit-tap-highlight-color: transparent; }
svg.i {
  width: 22px; height: 22px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}

/* The logo sits on white, also in dark mode */
.brand, .gate-logo { display: block; height: auto; }
.brand { width: 132px; flex: none; }
@media (prefers-color-scheme: dark) {
  .brand { box-sizing: content-box; padding: 5px 9px; border-radius: 12px; background: #fff; }
  .gate-logo { box-sizing: content-box; padding: 14px; border-radius: 24px; background: #fff; }
}

/* Sign-in: the logo is the welcome */
.gate {
  box-sizing: border-box; min-height: 100vh; min-height: 100dvh;
  display: grid; place-items: center; padding: 24px 16px;
}
.gate-card {
  box-sizing: border-box; width: 100%; max-width: 400px;
  display: grid; gap: 14px; justify-items: center; text-align: center;
  padding: 30px 22px 24px; background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 28px;
}
.gate-logo { width: 200px; margin-bottom: 4px; }
.gate-card h1 { font-size: 1.9rem; }
.gate-card .fine { max-width: 34ch; }
.gsi { min-height: 44px; display: grid; justify-items: center; }
.gate-foot { margin: 6px 0 0; color: var(--ink-soft); font-size: 0.82rem; max-width: 36ch; }

/* Header */
.intro { padding-block: 14px 12px; display: grid; gap: 10px; }
.topline { display: flex; align-items: center; gap: 10px; }
.topline .who { flex: 1; min-width: 0; justify-content: flex-end; text-align: right; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 2rem;
  line-height: 1.05;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; color: var(--ink-soft); font-size: 0.9rem; }
.who b { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14ch; }
.pill {
  display: inline-block; font-size: 0.76rem; font-weight: 700; line-height: 1.6;
  padding: 0 9px; border-radius: 99px; background: var(--pen-wash); color: var(--pen);
}
.pill.off { background: var(--out-wash); color: var(--out); }
.pill.ok { background: var(--ok-wash); color: var(--ok); }
.sub { margin: 0; color: var(--ink-soft); font-size: 0.95rem; }
.sync { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--ink-soft); font-size: 0.85rem; }
.banner {
  margin: 0; padding: 10px 12px; border-radius: 12px;
  background: var(--out-wash); color: var(--ink); font-size: 0.92rem;
}
.lockbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px 8px 12px; border-radius: 12px;
  background: var(--warn-wash); border: 1px solid var(--warn); color: var(--ink); font-size: 0.92rem;
}
.lockbar span { flex: 1; min-width: 0; font-weight: 700; }
.lockbar .btn { flex: none; height: 36px; }
.meter { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.meter span { display: block; height: 100%; width: 0; background: var(--pen); border-radius: inherit; }

/* Inventory switch */
.invs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.invs::-webkit-scrollbar { display: none; }
.inv {
  flex: none; height: 38px; padding: 0 16px;
  border: 1px solid var(--rule); border-radius: 99px; background: var(--sheet); color: var(--ink);
  font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
  cursor: pointer; touch-action: manipulation;
}
.inv[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--sheet); }

/* Count status card */
.status {
  display: grid; gap: 8px; padding: 12px 14px;
  border: 1px solid var(--rule); border-radius: 16px; background: var(--sheet);
}
.status.is-live { border-color: var(--pen); background: var(--pen-wash); }
.status.is-late { border-color: var(--warn); background: var(--warn-wash); }
.status p { margin: 0; }
.status .lead { font-weight: 700; }
.status .fine { font-size: 0.88rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Sticky search + sections */
.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.bar .wrap { padding-block: 10px; display: grid; gap: 8px; }
.controls { display: flex; gap: 8px; align-items: center; }
.search { flex: 1; min-width: 0; position: relative; display: block; }
.search svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 17px; height: 17px; stroke: var(--ink-soft); fill: none; pointer-events: none;
}
.search input {
  box-sizing: border-box; width: 100%; height: 44px;
  padding: 0 12px 0 38px;
  border: 1px solid var(--rule); border-radius: 99px;
  background: var(--sheet); color: var(--ink);
  font: inherit; font-size: 16px;
}
.search input::placeholder { color: var(--ink-soft); }
.toggle {
  flex: none; height: 44px; padding: 0 14px;
  border: 1px solid var(--rule); border-radius: 99px;
  background: var(--sheet); color: var(--ink);
  font: inherit; font-size: 0.9rem; font-weight: 700;
  white-space: nowrap; cursor: pointer;
}
.toggle[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 12px;
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--rule); border-radius: 99px;
  background: var(--sheet); color: var(--ink);
  font: inherit; cursor: pointer; touch-action: manipulation;
}
.chip b { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.chip small { font-size: 0.82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chip.is-complete small { color: var(--ok); font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[aria-pressed="true"] small { color: var(--paper); }

/* Lists */
.list { padding-block: 14px 8px; display: grid; gap: 22px; }
.group { display: grid; gap: 10px; }
.group-head { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: 400; }
.tag {
  font-family: var(--font-display); font-weight: 600;
  font-size: 1.15rem; line-height: 1;
  padding: 6px 11px 5px; border-radius: 8px;
  background: var(--tag); color: var(--tag-ink);
}
.tag.small { font-size: 0.98rem; padding: 5px 9px 4px; }
.brand-tag {
  font-family: var(--font-display); font-weight: 600;
  font-size: 1.15rem; line-height: 1.1;
  padding: 4px 10px; border: 2px solid var(--order); border-radius: 8px; color: var(--order);
  overflow-wrap: anywhere;
}
.group-meta { color: var(--ink-soft); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.rows {
  list-style: none; margin: 0; padding: 0;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden;
}
.row { border-top: 1px solid var(--rule); }
.row:first-child { border-top: 0; }
.row-main {
  box-sizing: border-box; min-height: 64px;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 8px 8px 4px;
}
.row-name {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  margin: 0; padding: 6px 4px;
  border: 0; border-radius: 8px; background: none;
  color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.name-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.thumb { width: 40px; height: 40px; flex: none; border-radius: 10px; object-fit: cover; background: var(--rule); }
.line1 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.pname { font-weight: 700; font-size: 1.02rem; line-height: 1.25; overflow-wrap: anywhere; }
.variant {
  font-size: 0.82rem; line-height: 1.5; padding: 0 8px;
  border: 1px solid var(--rule); border-radius: 99px; color: var(--ink-soft);
}
.badge-s {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 0.76rem; font-weight: 700; line-height: 1.6; padding: 0 8px; border-radius: 99px;
}
.badge-s.bad { background: var(--out-wash); color: var(--out); }
.badge-s.soon { background: var(--warn-wash); color: var(--warn); }
.badge-s.ok { background: var(--ok-wash); color: var(--ok); }
.badge-s.cold { background: var(--pen-wash); color: var(--pen); }
.badge-s svg.i { width: 13px; height: 13px; stroke-width: 2.2; }
.meta { font-size: 0.84rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.meta b { color: var(--ink); font-weight: 700; }
.stepper { flex: none; display: flex; align-items: flex-start; gap: 4px; }
.step {
  width: 42px; height: 42px; padding: 0;
  display: grid; place-items: center;
  border: 1px solid var(--rule); border-radius: 50%;
  background: var(--paper); color: var(--ink);
  font: inherit; font-size: 1.45rem; line-height: 1;
  cursor: pointer; touch-action: manipulation;
}
.step:active { background: var(--pen-wash); }
.qty-wrap { display: grid; justify-items: center; gap: 1px; }
.qty {
  box-sizing: border-box; width: 58px; height: 42px;
  border: 1px solid var(--rule); border-radius: 10px;
  background: var(--sheet); color: var(--ink);
  font: inherit; font-weight: 700; font-size: 1.2rem;
  text-align: center; font-variant-numeric: tabular-nums;
}
.qty::placeholder { color: var(--ink-soft); font-weight: 400; }
.unit { font-size: 0.72rem; color: var(--ink-soft); line-height: 1.1; }
.stepper.is-counted .qty { background: var(--pen-wash); border-color: var(--pen); color: var(--pen); }
.stepper.is-out .qty { background: var(--out-wash); border-color: var(--out); color: var(--out); }
.stepper.is-pending .qty { border-style: dashed; }
.stepper.order .step:active { background: var(--order-wash); }
.stepper.order.is-counted .qty { background: var(--order-wash); border-color: var(--order); color: var(--order); }
.cart {
  flex: none; width: 40px; height: 40px; padding: 0;
  display: grid; place-items: center;
  border: 1px solid var(--rule); border-radius: 50%;
  background: var(--sheet); color: var(--ink-soft);
  font: inherit; font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums;
  cursor: pointer; touch-action: manipulation;
}
.cart[aria-pressed="true"] { background: var(--order); border-color: var(--order); color: var(--sheet); }
.cart[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--order-wash), 0 0 0 4px var(--order); }
.cart svg.i { width: 20px; height: 20px; }
.order-ed {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  padding: 10px 12px 12px; border-top: 1px dashed var(--order); background: var(--order-wash);
}
.order-label { font-size: 0.9rem; font-weight: 700; color: var(--order); }
.order-info { flex: 1 1 100%; display: flex; align-items: center; gap: 10px; }
.order-info .meta { flex: 1; min-width: 0; }
.order-ed .step:active { background: var(--sheet); }
.order-ed.is-pending .oqty { border-style: dashed; }
.oqty {
  box-sizing: border-box; width: 58px; height: 42px;
  border: 1px solid var(--order); border-radius: 10px;
  background: var(--sheet); color: var(--order);
  font: inherit; font-weight: 700; font-size: 1.2rem;
  text-align: center; font-variant-numeric: tabular-nums;
}
.oqty::placeholder { color: var(--ink-soft); font-weight: 400; }
.stock {
  flex: none; min-width: 60px; box-sizing: border-box; padding: 4px 6px;
  display: grid; justify-items: center; gap: 1px;
}
.stock b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stock.is-out b { color: var(--out); }
.tick {
  flex: none; width: 44px; height: 44px; padding: 0;
  display: grid; place-items: center;
  border: 2px solid var(--rule); border-radius: 12px;
  background: var(--sheet); color: transparent; cursor: pointer; touch-action: manipulation;
}
.tick[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.row.is-bought .pname { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-soft); }
.buy-qty { flex: none; display: grid; justify-items: center; padding: 0 6px; }
.buy-qty b { font-size: 1.25rem; font-variant-numeric: tabular-nums; color: var(--order); }

/* Empty / loading */
.empty {
  display: grid; gap: 6px; padding: 22px 18px;
  border: 1px dashed var(--rule); border-radius: 16px; background: var(--sheet);
}
.empty h2, .h2 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: 1.35rem; line-height: 1.15; text-wrap: balance;
}
.empty p { margin: 0; color: var(--ink-soft); max-width: 60ch; }
.empty .btn { justify-self: start; margin-top: 6px; }

/* Order + admin */
.view-head { display: grid; gap: 10px; padding-top: 4px; }
.seg { display: inline-flex; justify-self: start; gap: 2px; padding: 3px; border: 1px solid var(--rule); border-radius: 99px; background: var(--sheet); }
.seg button {
  height: 36px; padding: 0 16px; border: 0; border-radius: 99px;
  background: none; color: var(--ink-soft); font: inherit; font-weight: 700; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.cards { display: grid; gap: 12px; padding-block: 8px 12px; }
.card { display: grid; gap: 8px; padding: 12px 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; }
.card p { margin: 0; }
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; }
.plain li { border-top: 1px solid var(--rule); }
.plain li:first-child { border-top: 0; }
.plain button {
  width: 100%; min-height: 52px; padding: 8px 2px; box-sizing: border-box;
  display: grid; gap: 2px; justify-items: start;
  border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer;
}
.plain .line1 small { color: var(--ink-soft); font-size: 0.82rem; }
.plain .static { padding: 8px 2px; display: grid; gap: 2px; }

/* Footer */
.actions { padding-block: 18px 12px; display: grid; gap: 12px; }
.hint { margin: 0; max-width: 60ch; color: var(--ink-soft); font-size: 0.9rem; }
.page-end { height: calc(86px + env(safe-area-inset-bottom, 0px)); }

/* Buttons */
.btn {
  height: 44px; padding: 0 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-sizing: border-box;
  border: 1px solid var(--rule); border-radius: 99px;
  background: var(--sheet); color: var(--ink);
  font: inherit; font-weight: 700; cursor: pointer; text-decoration: none;
}
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.btn.danger { color: var(--out); }
.btn.armed { background: var(--out); border-color: var(--out); color: var(--sheet); }
.link-btn {
  padding: 4px 2px; border: 0; background: none; color: var(--pen);
  font: inherit; font-weight: 700; cursor: pointer; text-decoration: none;
}
.sync .link-btn { padding: 2px 0; font-size: 0.85rem; }
.add-here { justify-self: start; }

/* Bottom tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--sheet); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar-inner { max-width: 720px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tab {
  position: relative; height: 62px; padding: 0;
  display: grid; justify-items: center; align-content: center; gap: 3px;
  border: 0; background: none; color: var(--ink-soft);
  font: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer; touch-action: manipulation;
}
.tab[aria-pressed="true"] { color: var(--pen); }
/* The scan button: a blue disc ringed like the logo's circle */
.tab .disc {
  width: 48px; height: 48px; margin-top: -22px;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--pen); color: var(--sheet);
  box-shadow: 0 0 0 4px var(--sheet), 0 0 0 6px var(--pen), 0 6px 16px var(--shadow);
}
.badge {
  position: absolute; top: 6px; left: calc(50% + 6px);
  min-width: 19px; height: 19px; padding: 0 5px; box-sizing: border-box;
  border-radius: 99px; background: var(--order); color: var(--sheet);
  font-size: 0.72rem; line-height: 19px; text-align: center; font-variant-numeric: tabular-nums;
}

/* Sheets (bottom panels) */
.backdrop { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  box-sizing: border-box; max-width: 720px; max-height: 92vh; margin: 0 auto; overflow-y: auto;
  display: grid; gap: 12px; align-content: start;
  padding-top: 20px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sheet); color: var(--ink);
  border: 1px solid var(--rule); border-bottom: 0; border-radius: 24px 24px 0 0;
  box-shadow: 0 -12px 32px var(--shadow);
}
.sheet h2 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: 1.45rem; line-height: 1.12; text-wrap: balance;
}
.sheet h3 { margin: 4px 0 0; font-size: 0.92rem; font-weight: 700; color: var(--ink-soft); }
.fine { margin: 0; color: var(--ink-soft); font-size: 0.9rem; }
.info { margin: 0; font-size: 0.95rem; }
.info b { font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 0.86rem; font-weight: 700; color: var(--ink-soft); }
.field input, .field select {
  box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px;
  border: 1px solid var(--rule); border-radius: 12px;
  background: var(--paper); color: var(--ink);
  font: inherit; font-size: 16px;
}
.field input:disabled { opacity: 0.7; }
.field input::placeholder { color: var(--ink-soft); }
.fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.with-btn { display: flex; gap: 8px; align-items: end; }
.with-btn .field { flex: 1; }
.checks { display: grid; gap: 2px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--pen); flex: none; }
.check small { color: var(--ink-soft); }
.edit-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.edit-actions .push { margin-left: auto; }
.photo-field { display: flex; align-items: center; gap: 12px; }
.ed-photo-view { flex: none; padding: 0; border: 0; background: none; border-radius: 12px; cursor: zoom-in; }
.ed-photo { display: block; width: 88px; height: 88px; object-fit: cover; border-radius: 12px; background: var(--rule); }
.hero-photo, .viewer-img { display: block; width: 100%; height: auto; object-fit: contain; border-radius: 16px; background: var(--paper); }
.hero-photo { max-height: 200px; cursor: zoom-in; }
.viewer-img { max-height: 70vh; }
.count-hint { margin: 0; display: flex; align-items: center; gap: 6px; color: var(--pen); font-weight: 700; font-size: 0.92rem; }
.count-hint svg.i { width: 18px; height: 18px; }
.batches { display: grid; gap: 8px; }
.batch { display: grid; grid-template-columns: 1fr 96px 44px; gap: 8px; align-items: end; }
.icon-btn {
  width: 44px; height: 44px; padding: 0; display: grid; place-items: center;
  border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); color: var(--ink-soft); cursor: pointer;
}
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.9rem; }
.hist li { display: flex; gap: 8px; justify-content: space-between; border-bottom: 1px dashed var(--rule); padding-bottom: 4px; }
.stepper.big { justify-content: center; gap: 10px; align-items: flex-start; }
.stepper.big .step { width: 58px; height: 58px; font-size: 1.8rem; }
.stepper.big .qty { width: 100px; height: 58px; font-size: 1.7rem; border-radius: 14px; }
.code-form { display: flex; gap: 8px; align-items: end; }
.code-form .field { flex: 1; }
.codebox {
  margin: 0; padding: 8px 10px; border: 1px dashed var(--rule); border-radius: 10px;
  background: var(--paper); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 1.05rem; letter-spacing: 0.06em; overflow-wrap: anywhere;
}
.pick {
  list-style: none; margin: 0; padding: 0;
  border: 1px solid var(--rule); border-radius: 16px;
  max-height: 44vh; overflow-y: auto; background: var(--sheet);
}
.pick li + li { border-top: 1px solid var(--rule); }
.pick button {
  width: 100%; min-height: 48px; padding: 8px 12px; box-sizing: border-box;
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
  border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer;
}
.pick small { margin-left: auto; color: var(--ink-soft); font-size: 0.8rem; }
.pick-empty { padding: 12px; color: var(--ink-soft); }
.loading { display: flex; align-items: center; gap: 12px; }
.spinner {
  width: 26px; height: 26px; flex: none; box-sizing: border-box; border-radius: 50%;
  border: 3px solid var(--rule); border-top-color: var(--pen);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.textcopy {
  box-sizing: border-box; width: 100%; min-height: 220px; padding: 10px;
  border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); color: var(--ink);
  font: inherit; font-size: 15px;
}
.live-wrap {
  position: relative; overflow: hidden; border-radius: 16px;
  background: var(--video); aspect-ratio: 4 / 3; max-height: 34vh; width: 100%;
}
.live-wrap video { display: block; width: 100%; height: 100%; object-fit: cover; }
.live-frame {
  position: absolute; left: 10%; right: 10%; top: 28%; bottom: 28%;
  border: 3px solid var(--tag); border-radius: 12px; pointer-events: none;
}
.live-wrap.flash .live-frame { border-color: var(--ok-fill); }
.scan-card { display: grid; gap: 8px; padding: 12px; border: 2px solid var(--pen); border-radius: 16px; background: var(--pen-wash); }
.scan-card .title { font-weight: 700; font-size: 1.05rem; }
.recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.recent li { display: flex; align-items: center; gap: 10px; min-height: 40px; border-bottom: 1px dashed var(--rule); }
.recent li span { flex: 1; min-width: 0; }
.recent li b { font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; z-index: 30;
  left: 50%; transform: translateX(-50%);
  top: calc(12px + env(safe-area-inset-top, 0px));
  box-sizing: border-box; width: max-content; max-width: calc(100vw - 32px);
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px; border-radius: 16px;
  background: var(--ink); color: var(--paper);
  font-size: 0.95rem; box-shadow: 0 8px 24px var(--shadow);
}
.toast-act {
  flex: none; min-height: 36px; padding: 0 4px;
  border: 0; background: none; color: var(--paper);
  font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}

@media (prefers-reduced-motion: no-preference) {
  .meter span { transition: width 0.3s ease; }
  .step, .chip, .toggle, .tick, .inv { transition: background-color 0.12s ease; }
}
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
@media (max-width: 360px) {
  .step { width: 38px; height: 38px; }
  .qty, .oqty { width: 50px; }
  .cart { width: 36px; height: 36px; }
  .brand { width: 112px; }
}
</style>
</head>

  // Every request goes through here. The server checks everything again, whatever this page shows.
  async function api(action, args) {
    const out = IN_APPS_SCRIPT ? await viaAppsScript(action, args) : await viaFetch(action, args);
    if (!out || typeof out !== 'object') throw { code: 'unavailable' };
    if (out.ok !== true) {
      const code = str(out.error) || 'ERROR';
      if (code === 'AUTH' && action !== 'signIn') sessionLost();
      if (code === 'LOCKED' && action !== 'signIn') appLocked();
      throw { code };
    }
    return out.data;
  }
  async function viaFetch(action, args) {
    let res;
    try {
      res = await fetch(CONFIG.BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // a "simple" request: no extra round trip
        body: JSON.stringify({ action, args: args || {}, session: S.session || '' }),
        cache: 'no-store',
        credentials: 'omit',
        redirect: 'follow',
      });
    } catch (e) {
      throw { code: navigator.onLine === false ? 'offline' : 'unavailable' };
    }
    try { return await res.json(); } catch (e) { return null; }
  }
  function viaAppsScript(action, args) {
    return new Promise((resolve, reject) => {
      window.google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(() => reject({ code: navigator.onLine === false ? 'offline' : 'unavailable' }))
        .call(action, args || {});
    });
  }
  async function withRetry(fn) {
    try { return await fn(); }
    catch (e) {
      if (e && (e.code === 'unavailable' || e.code === 'BUSY' || e.code === 'offline')) {
        await sleep(900 + Math.random() * 900);
        return await fn();
      }
      throw e;
    }
  }
  async function write(action, args) {
    S.inflight++;
    try { return await withRetry(() => api(action, args)); }
    finally { S.inflight--; S.lastWriteAt = Date.now(); }
  }
  function errText(e) {
    switch (e && e.code) {
      case 'DENIED': return 'No tienes permiso para eso.';
      case 'LOCKED': return 'La app está bloqueada.';
      case 'CLOSED': return 'El conteo de este inventario está cerrado.';
      case 'NOT_FOUND': return 'Ese producto se quitó en otro teléfono.';
      case 'CONFLICT': return 'Eso cambió en otro teléfono. Ya ves lo más reciente.';
      case 'BUSY': return 'El servidor está ocupado. Intenta en un momento.';
      case 'BAD_INPUT': return 'Revisa lo que escribiste e intenta de nuevo.';
      case 'BAD_IMAGE': return 'Esa foto es demasiado grande. Prueba con otra.';
      case 'DRIVE_ERROR': return 'No se pudo guardar la foto en Google Drive. Intenta de nuevo.';
      case 'SETUP_NEEDED': return 'Falta preparar el servidor: ejecuta setup en Apps Script.';
      case 'offline': return 'Estás sin internet. Revisa tu conexión e intenta de nuevo.';
      default: return 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
    }
  }
  function failed(e) {
    if (e && (e.code === 'AUTH' || e.code === 'LOCKED')) return;   // already back at the sign-in or locked card
    toast(errText(e));
    if (e && ['CLOSED', 'CONFLICT', 'NOT_FOUND', 'DENIED'].includes(e.code)) load();
    refresh();
  }
  function applyItem(it) {
    if (it && it.id) S.items.set(it.id, it);
  }

  /* ======================= Sign-in ======================= */
  let gisP = null;
  function loadGis() {
    if (window.google && window.google.accounts && window.google.accounts.id) return Promise.resolve();
    if (gisP) return gisP;
    gisP = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { gisP = null; s.remove(); reject(new Error('gis')); };
      document.head.append(s);
    });
    return gisP;
  }
  function emailFromToken(cred) {
    try {
      const part = cred.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return str(JSON.parse(decodeURIComponent(escape(atob(part + '==='.slice((part.length + 3) % 4))))).email);
    } catch (e) { return ''; }
  }
  // Shows the sign-in card in one of its states.
  async function gate(state, info) {
    closeSheets();
    $('#app').hidden = true;
    $('#gate').hidden = false;
    const title = $('#gate-title'), text = $('#gate-text'), btn = $('#gsi-btn');
    const signing = !IN_APPS_SCRIPT && (state === 'signin' || state === 'denied');
    $('#gate-loading').hidden = state !== 'loading';
    $('#gate-retry').hidden = !(state === 'error' || state === 'locked' || state === 'noaccess');
    btn.hidden = !signing;
    if (state === 'setup') {
      title.textContent = 'Casi listo';
      text.textContent = 'Abre index.html y pega tu BACKEND_URL y tu CLIENT_ID arriba del script (ve la guía de instalación).';
    } else if (state === 'loading') {
      title.textContent = 'Abriendo';
      text.textContent = '';
    } else if (state === 'locked') {
      title.textContent = 'Bloqueada';
      text.textContent = 'El administrador bloqueó la app por ahora. Intenta más tarde.';
    } else if (state === 'noaccess') {
      title.textContent = 'Solo el dueño';
      text.textContent = 'Esta versión de prueba solo abre con la cuenta de Google del dueño: dentro de Apps Script, Google solo le dice a la app quién es el dueño. Tu equipo usa la versión de GitHub.';
    } else if (state === 'denied') {
      title.textContent = 'No estás en la lista';
      text.textContent = (info || 'Esa cuenta de Google') + ' no está en la lista de la tienda. Pide al administrador que la agregue, o entra con otra cuenta.';
    } else if (state === 'error') {
      title.textContent = 'No se puede conectar';
      text.textContent = info || 'No se pudo llegar al servidor. Revisa tu conexión e intenta de nuevo.';
    } else {
      title.textContent = 'Inventario';
      text.textContent = info || 'Entra con la cuenta de Google que agregó el administrador.';
    }
    if (signing) {
      try { await loadGis(); }
      catch (e) { gate('error', 'El acceso con Google no cargó. Revisa tu conexión e intenta de nuevo.'); return; }
      const gid = window.google.accounts.id;
      gid.initialize({ client_id: CONFIG.CLIENT_ID, callback: onCredential, auto_select: state === 'signin',
        cancel_on_tap_outside: false, use_fedcm_for_prompt: true });
      btn.replaceChildren();
      gid.renderButton(btn, { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 280, locale: 'es-419' });
      if (state === 'signin') { try { gid.prompt(); } catch (e) { /* the button still works */ } }
    }
  }
  async function onCredential(resp) {
    const cred = resp && resp.credential;
    if (!cred) return;
    const email = emailFromToken(cred);
    gate('loading');
    try {
      const r = await api('signIn', { credential: cred });
      S.session = r.session;
      S.authLost = false;
      store.set('inv-session', r.session);
      await load(true);
    } catch (e) {
      const code = e && e.code;
      if (code === 'DENIED') gate('denied', email);
      else if (code === 'LOCKED') gate('locked');
      else if (code === 'BUSY') gate('error', 'Demasiados intentos de entrar. Espera unos minutos e intenta de nuevo.');
      else if (code === 'SETUP_NEEDED') gate('error', 'El servidor no está listo: pega el CLIENT_ID en Code.gs e implementa una versión nueva.');
      else if (code === 'AUTH') gate('signin', 'No se pudo entrar. Intenta de nuevo.');
      else gate('error');
    }
  }
  // The pass expired or was revoked: back to the sign-in card.
  function sessionLost() {
    if (S.authLost) return;
    S.authLost = true;
    S.session = null;
    S.loaded = false;
    store.del('inv-session');
    if (IN_APPS_SCRIPT) gate('noaccess');
    else gate('signin', 'Tu sesión terminó. Entra de nuevo para seguir.');
  }
  // The admin locked the app: show the locked card (the sign-in pass is kept for when it's unlocked).
  function appLocked() {
    if (S.lockedOut) return;
    S.lockedOut = true;
    S.loaded = false;
    gate('locked');
  }
  function signOut() {
    S.session = null;
    S.loaded = false;
    S.me = null;
    S.items = new Map();
    store.del('inv-session');
    try { if (window.google && window.google.accounts) window.google.accounts.id.disableAutoSelect(); } catch (e) { /* ignore */ }
    gate('signin', 'Saliste. Vuelve a entrar cuando quieras.');
  }
  $('#sign-out').addEventListener('click', signOut);
  $('#gate-retry').addEventListener('click', () => boot());

  /* ======================= Loading ======================= */
  async function load(first) {
    if (S.loading || !connected()) return;
    S.loading = true;
    const started = Date.now();
    try {
      const d = await api('load');
      if (first || !S.loaded || (S.inflight === 0 && !hasPending() && S.lastWriteAt < started)) applyLoad(d);
      S.loaded = true;
      S.syncedAt = new Date();
      $('#banner').hidden = true;
      if (first) showApp();
    } catch (e) {
      const code = e && e.code;
      if (code === 'AUTH' || code === 'LOCKED') return;   // already showing the right card
      if (!S.loaded) {
        if (code === 'DENIED' && IN_APPS_SCRIPT) gate('noaccess');
        else gate('error', code === 'SETUP_NEEDED' ? 'Falta preparar el servidor: ejecuta setup en Apps Script.' : '');
      } else {
        $('#banner').textContent = 'No se pudo llegar al servidor. Revisa tu conexión; los cambios podrían no guardarse.';
        $('#banner').hidden = false;
      }
    } finally {
      S.loading = false;
      refresh();
    }
  }
  function applyLoad(d) {
    S.me = d.me;
    S.inventories = d.inventories || [];
    S.counts = d.counts || [];
    S.prices = d.prices || {};
    S.people = d.people || [];
    S.recent = d.recent || [];
    S.sheetUrl = d.sheetUrl || '';
    S.locked = !!d.locked;
    S.items = new Map((d.items || []).map((it) => [it.id, it]));
    if (!S.inventories.some((v) => v.id === S.inv)) S.inv = S.inventories.length ? S.inventories[0].id : '';
    if (S.view === 'admin' && !isAdmin()) S.view = 'count';
    if (S.view === 'order' && !(can('plan') || can('tick'))) S.view = 'count';
  }
  function showApp() {
    $('#gate').hidden = true;
    $('#app').hidden = false;
    $('#sign-out').hidden = IN_APPS_SCRIPT;   // inside Apps Script you're signed in through Google itself
    renderTabs(true);
    refresh();
  }
  function boot() {
    S.authLost = false;
    S.lockedOut = false;
    if (configMissing()) { gate('setup'); return; }
    if (connected()) { gate('loading'); load(true); }
    else gate('signin');
  }

  /* ======================= Units and ordering ======================= */
  // Each inventory says what its packages are called and how many to order at a time
  // (Dulces: bolsas in pairs; Refrescos: cajas one by one). Admins set it in Admin > Inventarios.
  const PACK_WORDS = { paquete: ['paquete', 'paquetes'], caja: ['caja', 'cajas'], bolsa: ['bolsa', 'bolsas'] };
  const FULL_PACKS = { paquete: 'paquetes completos', caja: 'cajas completas', bolsa: 'bolsas completas' };
  const invOf = (id) => S.inventories.find((v) => v.id === id) || null;
  const packNameOf = (it) => { const v = invOf(it && it.inventory); return v && PACK_WORDS[v.packName] ? v.packName : 'paquete'; };
  const multipleOf = (it) => { const v = invOf(it && it.inventory); return (v && v.orderMultiple) || 1; };
  const unitOf = (it) => (['pack', 'pc', 'g'].includes(it && it.unit) ? it.unit : 'pack');
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  // The word for an amount: "caja"/"cajas" (whatever the inventory calls its packages), "pza"/"pzas" or "g".
  function unitWord(it, u, n) {
    const w = u === 'pc' ? ['pza', 'pzas'] : u === 'g' ? ['g', 'g'] : PACK_WORDS[packNameOf(it)];
    return w[n === 1 ? 0 : 1];
  }
  // A quantity in the product's counting unit, also in packages, pieces and grams when the package size is known.
  function eq(it, qty) {
    if (qty == null) return null;
    const P = num(it.packPieces), G = num(it.packGrams), u = unitOf(it);
    const out = { packs: null, pcs: null, grams: null };
    if (u === 'pack') { out.packs = qty; if (P) out.pcs = qty * P; if (G) out.grams = qty * G; }
    else if (u === 'pc') { out.pcs = qty; if (P) out.packs = qty / P; if (P && G) out.grams = qty * G / P; }
    else { out.grams = qty; if (G) out.packs = qty / G; if (P && G) out.pcs = qty * P / G; }
    return out;
  }
  const fmtGrams = (g) => (g >= 1000 ? nf.format(g / 1000) + ' kg' : nf0.format(g) + ' g');
  function fmtQty(it, qty) {
    if (qty == null) return '–';
    return nf.format(qty) + ' ' + unitWord(it, unitOf(it), qty);
  }
  const fmtPacks = (it, n) => nf.format(n) + ' ' + unitWord(it, 'pack', n);
  // "≈ 1.5 cajas · 2 kg": the other units, for a quantity in the counting unit.
  function eqText(it, qty) {
    const e = eq(it, qty);
    if (!e) return '';
    const u = unitOf(it), parts = [];
    if (u !== 'pack' && e.packs != null) parts.push(nf1.format(e.packs) + ' ' + unitWord(it, 'pack', e.packs));
    if (u !== 'pc' && e.pcs != null) parts.push(nf0.format(e.pcs) + ' ' + unitWord(it, 'pc', e.pcs));
    if (u !== 'g' && e.grams != null) parts.push(fmtGrams(e.grams));
    return parts.length ? '≈ ' + parts.join(' · ') : '';
  }
  // "Caja de 12 pzas"
  function packText(it) {
    const P = num(it.packPieces), G = num(it.packGrams);
    const parts = [];
    if (P) parts.push(nf.format(P) + ' ' + unitWord(it, 'pc', P));
    if (G) parts.push(fmtGrams(G));
    return parts.length ? cap(unitWord(it, 'pack', 1)) + ' de ' + parts.join(' · ') : '';
  }
  const packsOf = (it, qty) => { const e = eq(it, qty); return e ? e.packs : null; };
  // How many counting units come in one package: 1 when counting packages, else pieces or grams per package.
  function perPack(it) {
    const u = unitOf(it);
    if (u === 'pack') return 1;
    const n = num(u === 'pc' ? it.packPieces : it.packGrams);
    return n > 0 ? n : null;
  }
  // A new product starts with the unit most products of its inventory use (pieces in Refrescos).
  function defaultUnit(inv) {
    const n = { pack: 0, pc: 0, g: 0 };
    for (const it of S.items.values()) if (it.inventory === inv) n[unitOf(it)]++;
    if (n.pc > n.pack && n.pc >= n.g) return 'pc';
    if (n.g > n.pack && n.g > n.pc) return 'g';
    return 'pack';
  }
  // Min and max are in the unit the product is counted in (pieces for sodas, bags for most candy).
  function isLow(it) {
    const min = num(it.min), onHand = num(it.count);
    return min != null && onHand != null && onHand < min;
  }
  // The order suggestion, in packages. Below the minimum: enough whole packages to reach the maximum
  // (or the minimum when there's no maximum), rounded up to the inventory's step (2 = pairs).
  function suggestion(it) {
    const min = num(it.min), max = num(it.max), onHand = num(it.count), per = perPack(it);
    if (min == null || onHand == null || per == null) return null;
    if (onHand >= min) return 0;
    const target = max != null && max > min ? max : min;
    const m = multipleOf(it);
    return Math.max(m, Math.ceil((target - onHand) / per / m - 1e-9) * m);
  }
  // "mín 12 · máx 24 pzas"
  function minMaxText(it) {
    const min = num(it.min), max = num(it.max);
    if (min == null && max == null) return '';
    const parts = [];
    if (min != null) parts.push('mín ' + nf.format(min));
    if (max != null) parts.push('máx ' + nf.format(max));
    return parts.join(' · ') + ' ' + unitWord(it, unitOf(it), max != null ? max : min);
  }
  // "en pares de bolsas", "en cajas completas", "de 3 en 3 cajas"
  function ruleText(inv) {
    const m = (inv && inv.orderMultiple) || 1;
    const p = inv && PACK_WORDS[inv.packName] ? inv.packName : 'paquete';
    if (m === 1) return 'en ' + FULL_PACKS[p];
    if (m === 2) return 'en pares de ' + PACK_WORDS[p][1];
    return 'de ' + m + ' en ' + m + ' ' + PACK_WORDS[p][1];
  }
  // Expiry batches [{m: "2027-03", q: 12}]: month and year. A batch counts as expired from the 1st of its month.
  function batchesOf(it) {
    try {
      const a = JSON.parse(str(it && it.expiry) || '[]');
      return Array.isArray(a) ? a.filter((b) => b && /^\d{4}-\d{2}$/.test(b.m)) : [];
    } catch (e) { return []; }
  }
  function expiryDate(m) { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1); }
  const fmtExpiry = (m) => monthFmt.format(expiryDate(m));
  function expiryBadge(it) {
    const b = batchesOf(it)[0];
    if (!b) return null;
    const days = (expiryDate(b.m) - Date.now()) / 86400000;
    if (days <= 0) return { text: 'Caducó ' + fmtExpiry(b.m), cls: 'bad' };
    if (days <= 60) return { text: 'Caduca ' + fmtExpiry(b.m), cls: 'soon' };
    return null;
  }
  const fmtDay = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : (d.getFullYear() === new Date().getFullYear() ? dayFmt : dayFmtY).format(d); };
  const fmtUntil = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toDateString() === new Date().toDateString() ? timeFmt.format(d) : whenFmt.format(d);
  };
  const fmtMoney = (n) => '$' + money.format(n);
  // Ends a sentence with a period, unless it already ends with one (Spanish times end in "p.m.").
  const dot = (t) => (/[.!?…]$/.test(t) ? t : t + '.');
  // "$300.00/kg" or "$1.20/pza", to compare suppliers with different package sizes.
  function unitPrice(it, price) {
    const G = num(it.packGrams), P = num(it.packPieces);
    if (G) return fmtMoney(price / (G / 1000)) + '/kg';
    if (P) return fmtMoney(price / P) + '/pza';
    return '';
  }

  /* ======================= Products: sorting and search ======================= */
  const secOf = (d) => str(d && d.section).trim().toUpperCase() || '—';
  const labelOf = (d) => [str(d.product).trim() || 'Producto', str(d.variant).trim()].filter(Boolean).join(' ');
  // Sections keep the order of their products, like the paper list, so a new section goes at the end.
  function sortItems(arr) {
    const rank = new Map();
    for (const it of arr) {
      const k = it.inventory + '|' + secOf(it), o = num(it.order) ?? 1e9;
      if (!rank.has(k) || o < rank.get(k)) rank.set(k, o);
    }
    const r = (it) => rank.get(it.inventory + '|' + secOf(it));
    return arr.sort((a, b) => r(a) - r(b) || collator.compare(secOf(a), secOf(b)) || (num(a.order) ?? 1e9) - (num(b.order) ?? 1e9) ||
      collator.compare(str(a.product), str(b.product)) || collator.compare(str(a.variant), str(b.variant)));
  }
  const invItems = (inv) => sortItems([...S.items.values()].filter((it) => it.inventory === inv));
  function matchesSearch(it) {
    if (!S.q.length) return true;
    const hay = norm([it.product, it.variant, it.note, it.section, it.brand, it.supplier, it.barcode].join(' '));
    return S.q.every((t) => hay.includes(t));
  }
  const codeKey = (s) => {
    const c = str(s).replace(/[^0-9A-Za-z]/g, '');
    return /^\d+$/.test(c) ? c.replace(/^0+(?=\d)/, '') : c.toUpperCase();
  };
  const codesOf = (d) => str(d && d.barcode).split(/[\s,;]+/).map(codeKey).filter(Boolean);
  function findByBarcode(code) {
    const k = codeKey(code);
    if (!k) return [];
    return [...S.items.values()].filter((d) => codesOf(d).includes(k)).map((d) => d.id);
  }

  /* ======================= Saving counts (in order, one request at a time) ======================= */
  // Counting changes go through one queue so they reach the server in the order you made them.
  // Typing waits until you pause; taps and scans go right away and are grouped when they pile up.
  const typed = new Map();   // id -> {value, timer}: a number being typed
  const queue = [];          // [{kind: 'set'|'add', id, value|qty}]
  let sending = null;        // the ops being sent now
  let pumping = false;
  const hasPending = () => typed.size > 0 || queue.length > 0 || !!sending || orderPend.size > 0;

  // What the box should show: the server value plus everything not yet confirmed.
  function sessionVal(id) {
    const t = typed.get(id);
    if (t) return t.value;
    const d = S.items.get(id);
    let v = d ? num(d.sessionCount) : null;
    const apply = (op) => {
      if (op.id !== id) return;
      if (op.kind === 'set') v = op.value;
      else v = Math.max(0, round2((v || 0) + op.qty));
    };
    if (sending) sending.forEach(apply);
    queue.forEach(apply);
    return v;
  }
  function typeCount(id, value) {
    const t = typed.get(id);
    if (t) clearTimeout(t.timer);
    typed.set(id, { value, timer: setTimeout(() => commitTyped(id), 900) });
    S.keep.add(id);
    refresh();
  }
  function commitTyped(id) {
    const t = typed.get(id);
    if (!t) return;
    clearTimeout(t.timer);
    typed.delete(id);
    enqueue({ kind: 'set', id, value: t.value });
  }
  function addCount(id, qty) {
    commitTyped(id);
    enqueue({ kind: 'add', id, qty });
    S.keep.add(id);
  }
  function setCount(id, value) {
    commitTyped(id);
    enqueue({ kind: 'set', id, value });
    S.keep.add(id);
  }
  function enqueue(op) {
    if (op.kind === 'set') {
      for (let i = queue.length - 1; i >= 0; i--) if (queue[i].id === op.id) queue.splice(i, 1);   // a set replaces earlier changes
    } else {
      const last = queue[queue.length - 1];
      if (last && last.kind === 'add' && last.id === op.id) { last.qty = round2(last.qty + op.qty); refresh(); pump(); return; }
    }
    queue.push(op);
    refresh();
    pump();
  }
  async function pump() {
    if (pumping) return;
    pumping = true;
    S.inflight++;
    try {
      while (queue.length) {
        let ops;
        if (queue[0].kind === 'set') ops = [queue.shift()];
        else { ops = []; while (queue.length && queue[0].kind === 'add' && ops.length < 50) ops.push(queue.shift()); }
        sending = ops;
        refresh();
        try {
          if (ops[0].kind === 'set') {
            applyItem(await withRetry(() => api('countSet', { id: ops[0].id, value: ops[0].value })));
          } else {
            const sums = new Map();
            ops.forEach((o) => sums.set(o.id, round2((sums.get(o.id) || 0) + o.qty)));
            const adds = [...sums].filter(([, q]) => q !== 0).map(([id, qty]) => ({ id, qty }));
            const batch = rid('b');   // the same batch id on a retry: the server applies it only once
            if (adds.length) (await withRetry(() => api('countAdd', { adds, batch }))).forEach(applyItem);
          }
        } catch (e) {
          sending = null;
          if (e && (e.code === 'CLOSED' || e.code === 'DENIED' || e.code === 'AUTH')) queue.length = 0;
          failed(e);
        }
        sending = null;
      }
    } finally {
      pumping = false;
      S.inflight--;
      S.lastWriteAt = Date.now();
      refresh();
    }
  }

  /* ======================= Saving the order plan ======================= */
  const orderPend = new Map();   // id -> {buyQty, timer}
  const orderVal = (id) => (orderPend.has(id) ? orderPend.get(id).buyQty : num((S.items.get(id) || {}).buyQty));
  function setOrder(id, buyQty) {
    const p = orderPend.get(id);

    orderPend.set(id, { buyQty, timer: setTimeout(flushOrders, 800) });
    refresh();

  let orderFlushing = false;
  async function flushOrders() {
    if (orderFlushing) { setTimeout(flushOrders, 400); return; }
    const entries = [...orderPend].map(([id, p]) => { clearTimeout(p.timer); return { id, buyQty: p.buyQty }; });
    if (!entries.length) return;
    orderFlushing = true;
    try {
      (await write('orderSet', { entries })).forEach(applyItem);
      entries.forEach((e) => { const p = orderPend.get(e.id); if (p && p.buyQty === e.buyQty) orderPend.delete(e.id); });
    } catch (e) {
      entries.forEach((x) => orderPend.delete(x.id));

    } finally {
      orderFlushing = false;
      refresh();
    }
  }

  function syncChildren(parent, want, fromIndex = 0) {
    const cur = [...parent.children].slice(fromIndex);
    let same = cur.length === want.length;
    if (same) for (let i = 0; i < want.length; i++) if (cur[i] !== want[i]) { same = false; break; }
    if (same) return;
    const keep = new Set(want);
    for (const c of cur) if (!keep.has(c)) c.remove();
    let ref = parent.children[fromIndex] || null;
    for (const node of want) {
      if (node === ref) { ref = ref.nextElementSibling; continue; }
      parent.insertBefore(node, ref);

  // Shopping list: everything on the list, grouped by supplier, with a tick for each.

      const name = str(it.supplier) || str(it.brand) || 'Sin proveedor';
      const key = norm(name) + (str(it.supplier) || str(it.brand) ? '' : '~');
      let g = map.get(key);
      if (!g) { g = { key, name, items: [] }; map.set(key, g); }
      g.items.push(it);
    }
    const out = [...map.values()].sort((a, b) => (a.key.endsWith('~') ? 1 : 0) - (b.key.endsWith('~') ? 1 : 0) || collator.compare(a.name, b.name));

    return out;

  /* ======================= Bottom sheets ======================= */

  /* ======================= Scanning ======================= */

    const form = h('form', { class: 'code-form', autocomplete: 'off' },
      h('label', { class: 'field' }, h('span', { text: 'Lector Bluetooth o código escrito' }), input), h('button', { class: 'btn', type: 'submit', text: 'Aceptar' }));
    const card = h('div', { class: 'scan-card', hidden: true, 'aria-live': 'polite' });

    const recent = h('ul', { class: 'recent' });
    const done = h('button', { class: 'btn primary', type: 'button', 'data-close': '', text: 'Listo' });
    sc.els = { title, sub, seg, card, recent, recentTitle, cam, camBtn, camNote, input, video };
    const drawMode = () => {
      const inv = currentInv();
      title.textContent = sc.mode === 'count' ? 'Escanear para contar' : sc.mode === 'capture' ? 'Escanea el código' : 'Buscar por código';
      sub.textContent = sc.mode === 'count' ? 'Cada escaneo suma 1 en ' + (inv ? inv.name : 'este inventario') + '. Si escaneaste una caja o un paquete con varios, cambia la cantidad en la tarjeta.'

      h('div', { class: 'edit-actions' }, done)], () => drawScanCard(sc), () => { if (sc.mode === 'capture' && sc.onCancel && !sc.captured) sc.onCancel(); });
    S.scan = sc;
    drawMode();

      camNote.hidden = false;
      camNote.textContent = 'La cámara en vivo no funciona dentro de Apps Script. Usa “Foto del código”, un lector Bluetooth o escribe el código. La versión de GitHub sí tiene cámara en vivo.';

    toastFn = o.fn || null;
    toastAct.hidden = !o.action;
    toastAct.textContent = o.action || '';
    toastEl.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { toastEl.hidden = true; toastFn = null; undoBuf.length = 0; }, o.ms || (o.action ? 6000 : 3400));
  }
  toastAct.addEventListener('click', () => {
    const fn = toastFn;
    toastFn = null;
    toastEl.hidden = true;
    clearTimeout(toastT);
    if (fn) fn();
  });

  /* ======================= Start ======================= */
  $('#sync-refresh').addEventListener('click', () => load());
  setInterval(() => { if (document.visibilityState === 'visible' && S.loaded && connected()) load(); }, POLL_MS);
  setInterval(() => { if (S.loaded && S.view === 'count') refresh(); }, 30000);   // keeps "until" texts current
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      // Leaving the app (another app, the lock screen): the camera turns off. It comes back if the scanner is still open.
      if (S.liveStop && S.scan) { S.liveResume = S.scan; stopLive(); }
      return;
    }
    if (S.liveResume && S.liveResume === S.scan && cameraPossible()) startLive(S.scan);
    S.liveResume = null;
    if (S.loaded && connected()) load();
  });
  window.addEventListener('beforeunload', (e) => { if (typed.size || queue.length || sending) { typed.forEach((_, id) => commitTyped(id)); e.preventDefault(); } });
  boot();
})();
</script>
</body>
</html>
