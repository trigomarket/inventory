<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#ffd12e">
<title>Shop Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@700&display=swap">
<style>
/* One ruled column, like the paper list taped to the shelf. Yellow shelf tags mark inventories and sections.
   A bottom tab bar switches between Count, Scan, Order and Admin, depending on the person's role. */
:root {
  --paper: #f3f5f9;
  --sheet: #ffffff;
  --rule: #d5dce8;
  --ink: #1a2030;
  --ink-soft: #586176;
  --pen: #2443b3;
  --pen-wash: #e3e9fc;
  --tag: #ffd12e;
  --tag-ink: #201c08;
  --out: #b4302a;
  --out-wash: #fbe4e1;
  --warn: #8a5800;
  --warn-wash: #fdf0d2;
  --ok: #1f7a4a;
  --ok-wash: #def3e7;
  --scrim: rgb(12 15 24 / 0.45);
  --shadow: rgb(12 15 24 / 0.18);
  --video: #0b0d12;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #10131a;
    --sheet: #171b24;
    --rule: #2b3242;
    --ink: #e8ecf4;
    --ink-soft: #9ca5b9;
    --pen: #93a9ff;
    --pen-wash: #1e2846;
    --out: #ff8b7e;
    --out-wash: #3b1f1c;
    --warn: #f3c264;
    --warn-wash: #3a2e12;
    --ok: #7fd6a4;
    --ok-wash: #16301f;
    --scrim: rgb(0 0 0 / 0.6);
    --shadow: rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }
}

[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
}
img { max-width: 100%; }
.wrap {
  box-sizing: border-box;
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
button, label, a { -webkit-tap-highlight-color: transparent; }
svg.i {
  width: 22px; height: 22px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}

/* Sign-in gate */
.gate {
  box-sizing: border-box; min-height: 100vh; min-height: 100dvh;
  display: grid; place-items: center; padding: 24px 16px;
}
.gate-card {
  box-sizing: border-box; width: 100%; max-width: 420px;
  display: grid; gap: 14px; justify-items: start;
  padding: 26px 22px; background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 16px;
}
.gate-card h1 { font-size: 2.3rem; }
.gate-card .fine { max-width: 40ch; }
.gsi { min-height: 44px; }
.gate-foot { margin: 0; color: var(--ink-soft); font-size: 0.82rem; }

/* Header */
.intro { padding-block: 18px 12px; display: grid; gap: 10px; }
.topline { display: flex; align-items: center; gap: 10px; }
.topline .who { flex: 1; min-width: 0; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 2rem;
  line-height: 1;
  letter-spacing: 0.015em;
  text-transform: uppercase;
  text-wrap: balance;
}
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--ink-soft); font-size: 0.9rem; }
.who b { color: var(--ink); }
.pill {
  display: inline-block; font-size: 0.72rem; font-weight: 700; line-height: 1.6;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 0 8px; border-radius: 99px; background: var(--pen-wash); color: var(--pen);
}
.pill.off { background: var(--out-wash); color: var(--out); }
.pill.ok { background: var(--ok-wash); color: var(--ok); }
.sub { margin: 0; color: var(--ink-soft); font-size: 0.95rem; }
.sync { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--ink-soft); font-size: 0.85rem; }
.banner {
  margin: 0; padding: 10px 12px; border-radius: var(--radius);
  background: var(--out-wash); color: var(--ink); font-size: 0.92rem;
}
.lockbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px 8px 12px; border-radius: var(--radius);
  background: var(--warn-wash); border: 1px solid var(--warn); color: var(--ink); font-size: 0.92rem;
}
.lockbar span { flex: 1; min-width: 0; font-weight: 700; }
.lockbar .btn { flex: none; height: 36px; }
.meter { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.meter span { display: block; height: 100%; width: 0; background: var(--pen); border-radius: inherit; }

/* Inventory switch */
.invs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.invs::-webkit-scrollbar { display: none; }
.inv {
  flex: none; height: 36px; padding: 0 14px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); color: var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; letter-spacing: 0.04em; text-transform: uppercase;
  cursor: pointer; touch-action: manipulation;
}
.inv[aria-pressed="true"] { background: var(--tag); border-color: var(--tag); color: var(--tag-ink); }

/* Count status card */
.status {
  display: grid; gap: 8px; padding: 12px 14px;
  border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet);
}
.status.is-live { border-color: var(--pen); background: var(--pen-wash); }
.status.is-late { border-color: var(--warn); background: var(--warn-wash); }
.status p { margin: 0; }
.status .lead { font-weight: 700; }
.status .fine { font-size: 0.88rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Sticky search + sections */
.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.bar .wrap { padding-block: 10px; display: grid; gap: 8px; }
.controls { display: flex; gap: 8px; align-items: center; }
.search { flex: 1; min-width: 0; position: relative; display: block; }
.search svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 17px; height: 17px; stroke: var(--ink-soft); fill: none; pointer-events: none;
}
.search input {
  box-sizing: border-box; width: 100%; height: 44px;
  padding: 0 12px 0 36px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--sheet); color: var(--ink);
  font: inherit; font-size: 16px;
}
.search input::placeholder { color: var(--ink-soft); }
.toggle {
  flex: none; height: 44px; padding: 0 12px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--sheet); color: var(--ink);
  font: inherit; font-size: 0.9rem; font-weight: 700;
  white-space: nowrap; cursor: pointer;
}
.toggle[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 12px;
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--rule); border-radius: 99px;
  background: var(--sheet); color: var(--ink);
  font: inherit; cursor: pointer; touch-action: manipulation;
}
.chip b { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.04em; text-transform: uppercase; }
.chip small { font-size: 0.82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chip.is-complete small { color: var(--pen); font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[aria-pressed="true"] small { color: var(--paper); }

/* Lists */
.list { padding-block: 14px 8px; display: grid; gap: 22px; }
.group { display: grid; gap: 10px; }
.group-head { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: 400; }
.tag {
  font-family: var(--font-display); font-weight: 700;
  font-size: 1.4rem; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 5px 10px 4px; border-radius: 4px;
  background: var(--tag); color: var(--tag-ink);
}
.tag.small { font-size: 1rem; padding: 4px 8px 3px; }
.brand-tag {
  font-family: var(--font-display); font-weight: 700;
  font-size: 1.3rem; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 4px 9px 3px; border: 2px solid var(--ink); border-radius: 4px; color: var(--ink);
  overflow-wrap: anywhere;
}
.group-meta { color: var(--ink-soft); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.rows {
  list-style: none; margin: 0; padding: 0;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden;
}
.row { border-top: 1px solid var(--rule); }
.row:first-child { border-top: 0; }
.row-main {
  box-sizing: border-box; min-height: 64px;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 8px 8px 4px;
}
.row-name {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  margin: 0; padding: 6px 4px;
  border: 0; border-radius: 6px; background: none;
  color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.name-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.thumb { width: 40px; height: 40px; flex: none; border-radius: 6px; object-fit: cover; background: var(--rule); }
.line1 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.pname { font-weight: 700; font-size: 1.02rem; line-height: 1.25; overflow-wrap: anywhere; }
.variant {
  font-size: 0.82rem; line-height: 1.5; padding: 0 8px;
  border: 1px solid var(--rule); border-radius: 99px; color: var(--ink-soft);
}
.badge-s {
  font-size: 0.72rem; font-weight: 700; line-height: 1.6; padding: 0 7px;
  letter-spacing: 0.06em; text-transform: uppercase; border-radius: 99px;
}
.badge-s.bad { background: var(--out-wash); color: var(--out); }
.badge-s.soon { background: var(--warn-wash); color: var(--warn); }
.badge-s.ok { background: var(--ok-wash); color: var(--ok); }
.meta { font-size: 0.84rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.meta b { color: var(--ink); font-weight: 700; }
.stepper { flex: none; display: flex; align-items: flex-start; gap: 4px; }
.step {
  width: 42px; height: 42px; padding: 0;
  display: grid; place-items: center;
  border: 1px solid var(--rule); border-radius: 50%;
  background: var(--paper); color: var(--ink);
  font: inherit; font-size: 1.45rem; line-height: 1;
  cursor: pointer; touch-action: manipulation;
}
.step:active { background: var(--pen-wash); }
.qty-wrap { display: grid; justify-items: center; gap: 1px; }
.qty {
  box-sizing: border-box; width: 58px; height: 42px;
  border: 1px solid var(--rule); border-radius: 8px;
  background: var(--sheet); color: var(--ink);
  font: inherit; font-weight: 700; font-size: 1.2rem;
  text-align: center; font-variant-numeric: tabular-nums;
}
.qty::placeholder { color: var(--ink-soft); font-weight: 400; }
.unit { font-size: 0.72rem; color: var(--ink-soft); line-height: 1.1; }
.stepper.is-counted .qty { background: var(--pen-wash); border-color: var(--pen); color: var(--pen); }
.stepper.is-out .qty { background: var(--out-wash); border-color: var(--out); color: var(--out); }
.stepper.is-pending .qty { border-style: dashed; }
.cart {
  flex: none; width: 40px; height: 40px; padding: 0;
  display: grid; place-items: center;
  border: 1px solid var(--rule); border-radius: 50%;
  background: var(--sheet); color: var(--ink-soft);
  font: inherit; font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums;
  cursor: pointer; touch-action: manipulation;
}
.cart[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.cart[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--pen-wash), 0 0 0 4px var(--pen); }
.cart svg.i { width: 20px; height: 20px; }
.order-ed {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  padding: 10px 12px 12px; border-top: 1px dashed var(--pen); background: var(--pen-wash);
}
.order-label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pen); }
.order-info { flex: 1 1 100%; display: flex; align-items: center; gap: 10px; }
.order-info .meta { flex: 1; min-width: 0; }
.order-ed.is-pending .oqty { border-style: dashed; }
.oqty {
  box-sizing: border-box; width: 58px; height: 42px;
  border: 1px solid var(--pen); border-radius: 8px;
  background: var(--sheet); color: var(--pen);
  font: inherit; font-weight: 700; font-size: 1.2rem;
  text-align: center; font-variant-numeric: tabular-nums;
}
.oqty::placeholder { color: var(--ink-soft); font-weight: 400; }
.stock {
  flex: none; min-width: 60px; box-sizing: border-box; padding: 4px 6px;
  display: grid; justify-items: center; gap: 1px;
}
.stock b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stock.is-out b { color: var(--out); }
.tick {
  flex: none; width: 44px; height: 44px; padding: 0;
  display: grid; place-items: center;
  border: 2px solid var(--rule); border-radius: 10px;
  background: var(--sheet); color: transparent; cursor: pointer; touch-action: manipulation;
}
.tick[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.row.is-bought .pname { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-soft); }
.buy-qty { flex: none; display: grid; justify-items: center; padding: 0 6px; }
.buy-qty b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }

/* Empty / loading */
.empty {
  display: grid; gap: 6px; padding: 22px 18px;
  border: 1px dashed var(--rule); border-radius: var(--radius); background: var(--sheet);
}
.empty h2, .h2 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: 1.45rem; letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance;
}
.empty p { margin: 0; color: var(--ink-soft); max-width: 60ch; }
.empty .btn { justify-self: start; margin-top: 6px; }

/* Order + admin */
.view-head { display: grid; gap: 10px; padding-top: 4px; }
.seg { display: inline-flex; justify-self: start; gap: 2px; padding: 3px; border: 1px solid var(--rule); border-radius: 99px; background: var(--sheet); }
.seg button {
  height: 36px; padding: 0 16px; border: 0; border-radius: 99px;
  background: none; color: var(--ink-soft); font: inherit; font-weight: 700; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.cards { display: grid; gap: 12px; padding-block: 8px 12px; }
.card { display: grid; gap: 8px; padding: 12px 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); }
.card p { margin: 0; }
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; }
.plain li { border-top: 1px solid var(--rule); }
.plain li:first-child { border-top: 0; }
.plain button {
  width: 100%; min-height: 52px; padding: 8px 2px; box-sizing: border-box;
  display: grid; gap: 2px; justify-items: start;
  border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer;
}
.plain .line1 small { color: var(--ink-soft); font-size: 0.82rem; }
.plain .static { padding: 8px 2px; display: grid; gap: 2px; }

/* Footer */
.actions { padding-block: 18px 12px; display: grid; gap: 12px; }
.hint { margin: 0; max-width: 60ch; color: var(--ink-soft); font-size: 0.9rem; }
.page-end { height: calc(86px + env(safe-area-inset-bottom, 0px)); }

/* Buttons */
.btn {
  height: 42px; padding: 0 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-sizing: border-box;
  border: 1px solid var(--rule); border-radius: 8px;
  background: var(--sheet); color: var(--ink);
  font: inherit; font-weight: 700; cursor: pointer; text-decoration: none;
}
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.btn.danger { color: var(--out); }
.btn.armed { background: var(--out); border-color: var(--out); color: var(--sheet); }
.link-btn {
  padding: 4px 2px; border: 0; background: none; color: var(--pen);
  font: inherit; font-weight: 700; cursor: pointer; text-decoration: none;
}
.sync .link-btn { padding: 2px 0; font-size: 0.85rem; }
.add-here { justify-self: start; }

/* Bottom tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--sheet); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar-inner { max-width: 720px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tab {
  position: relative; height: 62px; padding: 0;
  display: grid; justify-items: center; align-content: center; gap: 3px;
  border: 0; background: none; color: var(--ink-soft);
  font: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer; touch-action: manipulation;
}
.tab[aria-pressed="true"] { color: var(--pen); }
.tab .disc {
  width: 46px; height: 46px; margin-top: -20px;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--pen); color: var(--sheet); box-shadow: 0 4px 14px var(--shadow);
}
.badge {
  position: absolute; top: 6px; left: calc(50% + 6px);
  min-width: 19px; height: 19px; padding: 0 5px; box-sizing: border-box;
  border-radius: 99px; background: var(--ink); color: var(--paper);
  font-size: 0.72rem; line-height: 19px; text-align: center; font-variant-numeric: tabular-nums;
}

/* Sheets (bottom panels) */
.backdrop { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  box-sizing: border-box; max-width: 720px; max-height: 92vh; margin: 0 auto; overflow-y: auto;
  display: grid; gap: 12px; align-content: start;
  padding-top: 18px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sheet); color: var(--ink);
  border: 1px solid var(--rule); border-bottom: 0; border-radius: 16px 16px 0 0;
  box-shadow: 0 -12px 32px var(--shadow);
}
.sheet h2 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: 1.5rem; line-height: 1.1; letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance;
}
.sheet h3 { margin: 4px 0 0; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.fine { margin: 0; color: var(--ink-soft); font-size: 0.9rem; }
.info { margin: 0; font-size: 0.95rem; }
.info b { font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 0.76rem; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.07em; text-transform: uppercase; }
.field input, .field select {
  box-sizing: border-box; width: 100%; height: 42px; padding: 0 10px;
  border: 1px solid var(--rule); border-radius: 8px;
  background: var(--paper); color: var(--ink);
  font: inherit; font-size: 16px;
}
.field input:disabled { opacity: 0.7; }
.field input::placeholder { color: var(--ink-soft); }
.fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.with-btn { display: flex; gap: 8px; align-items: end; }
.with-btn .field { flex: 1; }
.checks { display: grid; gap: 2px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 42px; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--pen); flex: none; }
.check small { color: var(--ink-soft); }
.edit-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.edit-actions .push { margin-left: auto; }
.photo-field { display: flex; align-items: center; gap: 12px; }
.ed-photo-view { flex: none; padding: 0; border: 0; background: none; border-radius: 8px; cursor: zoom-in; }
.ed-photo { display: block; width: 88px; height: 88px; object-fit: cover; border-radius: 8px; background: var(--rule); }

<script>
(function () {
  'use strict';

  /* ======================= Settings: paste your two values here ======================= */

    // Apps Script > Deploy > Manage deployments > Web app URL. It ends in /exec.

  /* ======================= Small helpers ======================= */

  const svg = (d) => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>';
  const ICON = {

    check: svg('<path d="M5 12.5l4.2 4.2L19 7"></path>'),

    cart: svg('<path d="M3 4h2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"></path><circle cx="9.5" cy="19.5" r="1.3"></circle><circle cx="17" cy="19.5" r="1.3"></circle>'),
    scan: svg('<path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10"></path>'),
    gear: svg('<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path>'),
    trash: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.2A2 2 0 0 0 9 21h6a2 2 0 0 0 2-1.8L18 7M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"></path>'),

  const str = (v) => (typeof v === 'string' ? v : v == null ? '' : String(v));
  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);

  const pad = (n) => String(n).padStart(2, '0');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const tick = () => new Promise((r) => setTimeout(r, 0));
  const round2 = (n) => Math.round(n * 100) / 100;
  const collator = new Intl.Collator('es', { numeric: true, sensitivity: 'base' });
  const nf = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });
  const nf1 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 });
  const nf0 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
  const money = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const timeFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
  const whenFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const dayFmt = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
  const dayFmtY = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const POLL_MS = 30000;
  const ROLE_NAME = { admin: 'Admin', buyer: 'Buyer', counter: 'Counter', viewer: 'Viewer' };
  const UNIT_NAME = { pack: ['pack', 'packs'], pc: ['pc', 'pcs'], g: ['g', 'g'] };
  function rid(prefix) {
    const a = new Uint8Array(8);
    crypto.getRandomValues(a);
    return (prefix || '') + Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  // Remembered on this phone only: the sign-in pass and a few view choices. Never product data.
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } },
  };

  /* ======================= State ======================= */
  const S = {
    session: store.get('inv-session'), me: null, loaded: false, loading: false,
    inventories: [], items: new Map(), counts: [], prices: {}, people: [], recent: [], sheetUrl: '', orderMultiple: 2,
    inv: store.get('inv-current') || '', view: store.get('inv-view') || 'count', orderMode: store.get('inv-order-mode') || 'plan',
    q: [], filter: false, section: 'all', keep: new Set(), orderOpen: null,
    inflight: 0, lastWriteAt: 0, syncedAt: null, authLost: false,
    sheetSync: null, onSheetClose: null, scan: null, photoFor: null, photoBusy: null,
  };
  const can = (p) => !!(S.me && S.me.can && S.me.can[p]);
  const isAdmin = () => !!(S.me && S.me.role === 'admin');
  const invName = (id) => (S.inventories.find((v) => v.id === id) || { name: id || '—' }).name;
  const currentInv = () => S.inventories.find((v) => v.id === S.inv) || null;
  const openCount = (inv) => S.counts.find((c) => c.inventory === inv && c.status === 'open') || null;
  const isLate = (c) => !c || !(Date.parse(c.until) > Date.now());
  // True when this person may count in the selected inventory right now.
  function countingHere() {
    const c = openCount(S.inv);
    if (!c || !c.canCount) return false;
    return isAdmin() || !isLate(c);
  }

  /* ======================= Talking to the server ======================= */
  // Two ways to run this same page:
  //  - On GitHub Pages: requests go to the script's /exec link with the sign-in pass (people sign in with Google).
  //  - Inside Apps Script (the test drive): the page talks to the script directly and Google says who you are.
  const IN_APPS_SCRIPT = !!(window.google && window.google.script && window.google.script.run);
  const configMissing = () => !IN_APPS_SCRIPT && /PASTE-/.test(CONFIG.BACKEND_URL + CONFIG.CLIENT_ID);
  const connected = () => IN_APPS_SCRIPT || !!S.session;

  // Every request goes through here. The server checks everything again, whatever this page shows.
  async function api(action, args) {
    const out = IN_APPS_SCRIPT ? await viaAppsScript(action, args) : await viaFetch(action, args);
    if (!out || typeof out !== 'object') throw { code: 'unavailable' };
    if (out.ok !== true) {
      const code = str(out.error) || 'ERROR';
      if (code === 'AUTH' && action !== 'signIn') sessionLost();
      if (code === 'LOCKED' && action !== 'signIn') appLocked();
      throw { code };
    }
    return out.data;
  }
  async function viaFetch(action, args) {
    let res;
    try {
      res = await fetch(CONFIG.BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // a "simple" request: no extra round trip
        body: JSON.stringify({ action, args: args || {}, session: S.session || '' }),
        cache: 'no-store',
        credentials: 'omit',
        redirect: 'follow',

      throw { code: navigator.onLine === false ? 'offline' : 'unavailable' };
    }

  }
  function viaAppsScript(action, args) {
    return new Promise((resolve, reject) => {
      window.google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(() => reject({ code: navigator.onLine === false ? 'offline' : 'unavailable' }))
        .call(action, args || {});
    });
  }
  async function withRetry(fn) {

      }
      throw e;
    }
  }
  async function write(action, args) {
    S.inflight++;
    try { return await withRetry(() => api(action, args)); }
    finally { S.inflight--; S.lastWriteAt = Date.now(); }
  }
  function errText(e) {
    switch (e && e.code) {
      case 'DENIED': return 'Not allowed.';
      case 'LOCKED': return 'The app is locked.';
      case 'CLOSED': return 'Counting is closed for this inventory.';
      case 'NOT_FOUND': return 'That product was removed on another phone.';
      case 'CONFLICT': return 'That changed on another phone. Showing the latest.';
      case 'BUSY': return 'The server is busy. Try again in a moment.';
      case 'BAD_INPUT': return 'Check what you typed and try again.';
      case 'BAD_IMAGE': return 'That photo is too large to save. Try another one.';

  function failed(e) {
    if (e && (e.code === 'AUTH' || e.code === 'LOCKED')) return;   // already back at the sign-in or locked card
    toast(errText(e));

    refresh();
  }
  function applyItem(it) {
    if (it && it.id) S.items.set(it.id, it);
  }

  /* ======================= Sign-in ======================= */
  let gisP = null;
  function loadGis() {
    if (window.google && window.google.accounts && window.google.accounts.id) return Promise.resolve();
    if (gisP) return gisP;
    gisP = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { gisP = null; s.remove(); reject(new Error('gis')); };
      document.head.append(s);
    });
    return gisP;
  }
  function emailFromToken(cred) {
    try {
      const part = cred.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return str(JSON.parse(decodeURIComponent(escape(atob(part + '==='.slice((part.length + 3) % 4))))).email);
    } catch (e) { return ''; }
  }
  // Shows the sign-in card in one of its states.
  async function gate(state, info) {
    closeSheets();
    $('#app').hidden = true;
    $('#gate').hidden = false;
    const title = $('#gate-title'), text = $('#gate-text'), btn = $('#gsi-btn');

    $('#gate-retry').hidden = !(state === 'error' || state === 'locked' || state === 'noaccess');

      title.textContent = 'Almost ready';
      text.textContent = 'Open index.html and paste your BACKEND_URL and CLIENT_ID at the top of the script (see the setup guide).';

      text.textContent = 'This test version opens only for the owner’s Google account: inside Apps Script, Google only tells the app who the owner is. Your team uses the GitHub version.';
    } else if (state === 'denied') {
      title.textContent = 'Not on the list';
      text.textContent = (info || 'That Google account') + ' isn’t on this shop’s list. Ask the admin to add it, or sign in with another account.';
    } else if (state === 'error') {
      title.textContent = 'Can’t connect';
      text.textContent = info || 'Couldn’t reach the server. Check your connection and try again.';
    } else {
      title.textContent = 'Sign in';
      text.textContent = info || 'Use the Google account your admin added.';

      catch (e) { gate('error', 'Google sign-in didn’t load. Check your connection and try again.'); return; }

        cancel_on_tap_outside: false, use_fedcm_for_prompt: true });

      gid.renderButton(btn, { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 280 });
      if (state === 'signin') { try { gid.prompt(); } catch (e) { /* the button still works */ } }
    }
  }
  async function onCredential(resp) {
    const cred = resp && resp.credential;
    if (!cred) return;
    const email = emailFromToken(cred);
    gate('loading');
    try {
      const r = await api('signIn', { credential: cred });
      S.session = r.session;
      S.authLost = false;
      store.set('inv-session', r.session);
      await load(true);
    } catch (e) {
      const code = e && e.code;
      if (code === 'DENIED') gate('denied', email);
      else if (code === 'LOCKED') gate('locked');
      else if (code === 'BUSY') gate('error', 'Too many sign-in attempts. Wait a few minutes and try again.');
      else if (code === 'SETUP_NEEDED') gate('error', 'The server isn’t ready: paste the CLIENT_ID in Code.gs and deploy a new version.');
      else if (code === 'AUTH') gate('signin', 'That sign-in didn’t work. Try again.');
      else gate('error');
    }
  }
  // The pass expired or was revoked: back to the sign-in card.
  function sessionLost() {
    if (S.authLost) return;
    S.authLost = true;
    S.session = null;
    S.loaded = false;
    store.del('inv-session');
    if (IN_APPS_SCRIPT) gate('noaccess');
    else gate('signin', 'Your sign-in ended. Sign in again to continue.');
  }
  // The admin locked the app: show the locked card (the sign-in pass is kept for when it's unlocked).
  function appLocked() {
    if (S.lockedOut) return;
    S.lockedOut = true;
    S.loaded = false;
    gate('locked');
  }
  function signOut() {
    S.session = null;
    S.loaded = false;
    S.me = null;
    S.items = new Map();
    store.del('inv-session');
    try { if (window.google && window.google.accounts) window.google.accounts.id.disableAutoSelect(); } catch (e) { /* ignore */ }
    gate('signin', 'Signed out.');
  }
  $('#sign-out').addEventListener('click', signOut);
  $('#gate-retry').addEventListener('click', () => boot());

  /* ======================= Loading ======================= */
  async function load(first) {
    if (S.loading || !connected()) return;
    S.loading = true;
    const started = Date.now();
    try {
      const d = await api('load');
      if (first || !S.loaded || (S.inflight === 0 && !hasPending() && S.lastWriteAt < started)) applyLoad(d);
      S.loaded = true;
      S.syncedAt = new Date();
      $('#banner').hidden = true;
      if (first) showApp();
    } catch (e) {
      const code = e && e.code;
      if (code === 'AUTH' || code === 'LOCKED') return;   // already showing the right card
      if (!S.loaded) {
        if (code === 'DENIED' && IN_APPS_SCRIPT) gate('noaccess');
        else gate('error', code === 'SETUP_NEEDED' ? 'The server needs setup. Run setup in Apps Script.' : '');
      } else {
        $('#banner').textContent = 'Couldn’t reach the server. Check your connection; changes may not save.';
        $('#banner').hidden = false;
      }
    } finally {
      S.loading = false;
      refresh();
    }
  }
  function applyLoad(d) {
    S.me = d.me;
    S.inventories = d.inventories || [];
    S.counts = d.counts || [];
    S.prices = d.prices || {};
    S.people = d.people || [];
    S.recent = d.recent || [];
    S.sheetUrl = d.sheetUrl || '';
    S.orderMultiple = d.orderMultiple || 1;
    S.locked = !!d.locked;
    S.items = new Map((d.items || []).map((it) => [it.id, it]));
    if (!S.inventories.some((v) => v.id === S.inv)) S.inv = S.inventories.length ? S.inventories[0].id : '';
    if (S.view === 'admin' && !isAdmin()) S.view = 'count';
    if (S.view === 'order' && !(can('plan') || can('tick'))) S.view = 'count';
  }
  function showApp() {
    $('#gate').hidden = true;
    $('#app').hidden = false;
    $('#sign-out').hidden = IN_APPS_SCRIPT;   // inside Apps Script you're signed in through Google itself
    renderTabs(true);
    refresh();
  }
  function boot() {
    S.authLost = false;
    S.lockedOut = false;
    if (configMissing()) { gate('setup'); return; }
    if (connected()) { gate('loading'); load(true); }
    else gate('signin');
  }

  /* ======================= Units ======================= */
  const unitOf = (it) => (['pack', 'pc', 'g'].includes(it && it.unit) ? it.unit : 'pack');
  const unitLabel = (u, n) => UNIT_NAME[u][n === 1 ? 0 : 1];
  // A quantity in the product's counting unit, also in packs, pieces and grams when the pack size is known.
  function eq(it, qty) {
    if (qty == null) return null;
    const P = num(it.packPieces), G = num(it.packGrams), u = unitOf(it);
    const out = { packs: null, pcs: null, grams: null };
    if (u === 'pack') { out.packs = qty; if (P) out.pcs = qty * P; if (G) out.grams = qty * G; }
    else if (u === 'pc') { out.pcs = qty; if (P) out.packs = qty / P; if (P && G) out.grams = qty * G / P; }
    else { out.grams = qty; if (G) out.packs = qty / G; if (P && G) out.pcs = qty * P / G; }
    return out;
  }
  const fmtGrams = (g) => (g >= 1000 ? nf.format(g / 1000) + ' kg' : nf0.format(g) + ' g');
  function fmtQty(it, qty) {
    if (qty == null) return '–';
    return nf.format(qty) + ' ' + unitLabel(unitOf(it), qty);
  }
  // "≈ 325 pcs · 1.3 kg": the other units, for a quantity in the counting unit.
  function eqText(it, qty) {
    const e = eq(it, qty);
    if (!e) return '';
    const u = unitOf(it), parts = [];
    if (u !== 'pack' && e.packs != null) parts.push(nf1.format(e.packs) + ' ' + unitLabel('pack', e.packs));
    if (u !== 'pc' && e.pcs != null) parts.push(nf0.format(e.pcs) + ' pcs');
    if (u !== 'g' && e.grams != null) parts.push(fmtGrams(e.grams));
    return parts.length ? '≈ ' + parts.join(' · ') : '';
  }
  function packText(it) {
    const P = num(it.packPieces), G = num(it.packGrams);
    const parts = [];
    if (P) parts.push(nf.format(P) + ' pcs');
    if (G) parts.push(fmtGrams(G));
    return parts.length ? 'Pack: ' + parts.join(' · ') : '';
  }
  const packsOf = (it, qty) => { const e = eq(it, qty); return e ? e.packs : null; };
  // Min/max ordering in packs: below min, order up to max, rounded up to the order multiple ("in pairs").
  function suggestion(it) {
    const min = num(it.min), max = num(it.max);
    const onHand = packsOf(it, num(it.count));
    if (min == null || max == null || onHand == null) return null;
    if (onHand >= min) return 0;
    const m = S.orderMultiple || 1;
    return Math.max(m, Math.ceil((max - onHand) / m - 1e-9) * m);
  }
  // Expiry batches [{m: "2027-03", q: 12}]: month and year. A batch counts as expired from the 1st of its month.
  function batchesOf(it) {
    try {
      const a = JSON.parse(str(it && it.expiry) || '[]');
      return Array.isArray(a) ? a.filter((b) => b && /^\d{4}-\d{2}$/.test(b.m)) : [];
    } catch (e) { return []; }
  }
  function expiryDate(m) { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1); }
  const fmtExpiry = (m) => { const d = expiryDate(m); return (d.getFullYear() === new Date().getFullYear() ? dayFmt : dayFmtY).format(d); };
  function expiryBadge(it) {
    const b = batchesOf(it)[0];
    if (!b) return null;
    const days = (expiryDate(b.m) - Date.now()) / 86400000;
    if (days <= 0) return { text: 'Expired ' + fmtExpiry(b.m), cls: 'bad' };
    if (days <= 60) return { text: 'Exp ' + fmtExpiry(b.m), cls: 'soon' };
    return null;
  }
  const fmtDay = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : (d.getFullYear() === new Date().getFullYear() ? dayFmt : dayFmtY).format(d); };
  const fmtUntil = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toDateString() === new Date().toDateString() ? timeFmt.format(d) : whenFmt.format(d);
  };
  const fmtMoney = (n) => '$' + money.format(n);
  // "$300.00/kg" or "$1.20/pc", to compare suppliers with different pack sizes.
  function unitPrice(it, price) {
    const G = num(it.packGrams), P = num(it.packPieces);
    if (G) return fmtMoney(price / (G / 1000)) + '/kg';
    if (P) return fmtMoney(price / P) + '/pc';
    return '';
  }

  /* ======================= Products: sorting and search ======================= */
  const secOf = (d) => str(d && d.section).trim().toUpperCase() || '—';
  const labelOf = (d) => [str(d.product).trim() || 'Product', str(d.variant).trim()].filter(Boolean).join(' ');
  function sortItems(arr) {
    return arr.sort((a, b) => collator.compare(secOf(a), secOf(b)) || (num(a.order) ?? 1e9) - (num(b.order) ?? 1e9) ||
      collator.compare(str(a.product), str(b.product)) || collator.compare(str(a.variant), str(b.variant)));
  }
  const invItems = (inv) => sortItems([...S.items.values()].filter((it) => it.inventory === inv));
  function matchesSearch(it) {
    if (!S.q.length) return true;
    const hay = norm([it.product, it.variant, it.note, it.section, it.brand, it.supplier, it.barcode].join(' '));
    return S.q.every((t) => hay.includes(t));
  }
  const codeKey = (s) => {
    const c = str(s).replace(/[^0-9A-Za-z]/g, '');
    return /^\d+$/.test(c) ? c.replace(/^0+(?=\d)/, '') : c.toUpperCase();
  };
  const codesOf = (d) => str(d && d.barcode).split(/[\s,;]+/).map(codeKey).filter(Boolean);
  function findByBarcode(code) {
    const k = codeKey(code);
    if (!k) return [];
    return [...S.items.values()].filter((d) => codesOf(d).includes(k)).map((d) => d.id);
  }

  /* ======================= Saving counts (in order, one request at a time) ======================= */
  // Counting changes go through one queue so they reach the server in the order you made them.
  // Typing waits until you pause; taps and scans go right away and are grouped when they pile up.
  const typed = new Map();   // id -> {value, timer}: a number being typed
  const queue = [];          // [{kind: 'set'|'add', id, value|qty}]
  let sending = null;        // the ops being sent now
  let pumping = false;
  const hasPending = () => typed.size > 0 || queue.length > 0 || !!sending || orderPend.size > 0;

  // What the box should show: the server value plus everything not yet confirmed.
  function sessionVal(id) {
    const t = typed.get(id);
    if (t) return t.value;
    const d = S.items.get(id);
    let v = d ? num(d.sessionCount) : null;
    const apply = (op) => {
      if (op.id !== id) return;
      if (op.kind === 'set') v = op.value;
      else v = Math.max(0, round2((v || 0) + op.qty));
    };
    if (sending) sending.forEach(apply);
    queue.forEach(apply);
    return v;
  }
  function typeCount(id, value) {
    const t = typed.get(id);
    if (t) clearTimeout(t.timer);
    typed.set(id, { value, timer: setTimeout(() => commitTyped(id), 900) });
    S.keep.add(id);
    refresh();
  }
  function commitTyped(id) {
    const t = typed.get(id);
    if (!t) return;
    clearTimeout(t.timer);
    typed.delete(id);
    enqueue({ kind: 'set', id, value: t.value });
  }
  function addCount(id, qty) {
    commitTyped(id);
    enqueue({ kind: 'add', id, qty });
    S.keep.add(id);
  }
  function setCount(id, value) {
    commitTyped(id);
    enqueue({ kind: 'set', id, value });
    S.keep.add(id);
  }
  function enqueue(op) {
    if (op.kind === 'set') {
      for (let i = queue.length - 1; i >= 0; i--) if (queue[i].id === op.id) queue.splice(i, 1);   // a set replaces earlier changes
    } else {
      const last = queue[queue.length - 1];
      if (last && last.kind === 'add' && last.id === op.id) { last.qty = round2(last.qty + op.qty); refresh(); pump(); return; }
    }
    queue.push(op);
    refresh();
    pump();
  }
  async function pump() {
    if (pumping) return;
    pumping = true;
    S.inflight++;
    try {
      while (queue.length) {
        let ops;
        if (queue[0].kind === 'set') ops = [queue.shift()];
        else { ops = []; while (queue.length && queue[0].kind === 'add' && ops.length < 50) ops.push(queue.shift()); }
        sending = ops;
        refresh();
        try {
          if (ops[0].kind === 'set') {
            applyItem(await withRetry(() => api('countSet', { id: ops[0].id, value: ops[0].value })));
          } else {
            const sums = new Map();
            ops.forEach((o) => sums.set(o.id, round2((sums.get(o.id) || 0) + o.qty)));
            const adds = [...sums].filter(([, q]) => q !== 0).map(([id, qty]) => ({ id, qty }));
            const batch = rid('b');   // the same batch id on a retry: the server applies it only once
            if (adds.length) (await withRetry(() => api('countAdd', { adds, batch }))).forEach(applyItem);
          }
        } catch (e) {
          sending = null;
          if (e && (e.code === 'CLOSED' || e.code === 'DENIED' || e.code === 'AUTH')) queue.length = 0;
          failed(e);
        }
        sending = null;
      }
    } finally {
      pumping = false;
      S.inflight--;
      S.lastWriteAt = Date.now();
      refresh();
    }
  }

  /* ======================= Saving the order plan ======================= */
  const orderPend = new Map();   // id -> {buyQty, timer}
  const orderVal = (id) => (orderPend.has(id) ? orderPend.get(id).buyQty : num((S.items.get(id) || {}).buyQty));
  function setOrder(id, buyQty) {
    const p = orderPend.get(id);
    if (p) clearTimeout(p.timer);
    orderPend.set(id, { buyQty, timer: setTimeout(flushOrders, 800) });
    refresh();
  }
  let orderFlushing = false;
  async function flushOrders() {
    if (orderFlushing) { setTimeout(flushOrders, 400); return; }
    const entries = [...orderPend].map(([id, p]) => { clearTimeout(p.timer); return { id, buyQty: p.buyQty }; });
    if (!entries.length) return;
    orderFlushing = true;
    try {
      (await write('orderSet', { entries })).forEach(applyItem);
      entries.forEach((e) => { const p = orderPend.get(e.id); if (p && p.buyQty === e.buyQty) orderPend.delete(e.id); });
    } catch (e) {
      entries.forEach((x) => orderPend.delete(x.id));
      failed(e);
    } finally {
      orderFlushing = false;
      refresh();
    }
  }

  /* ======================= Rendering ======================= */
  let rafPending = false;
  function refresh() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; render(); });
  }
  function render() {
    if (!S.loaded || !S.me) return;
    const inv = currentInv();
    $('#title').textContent = S.view === 'admin' ? 'Admin' : S.view === 'order' && orderMode() === 'list' ? 'Shopping list' : inv ? inv.name : 'Inventory';
    renderWho();
    renderLockbar();
    renderInvs();
    $('#sync').hidden = !S.syncedAt;
    if (S.syncedAt) $('#sync-time').textContent = 'Updated ' + timeFmt.format(S.syncedAt);
    renderTabs(false);
    const v = S.view;
    $('#view-count').hidden = v !== 'count';
    $('#view-order').hidden = v !== 'order';
    $('#view-admin').hidden = v !== 'admin';
    if (v !== 'count') $('#status').hidden = true;
    if (v === 'count') renderCount();
    else if (v === 'order') renderOrder();
    else renderAdmin();
    if (S.sheetSync && !$('#panel').hidden) S.sheetSync();
  }
  function renderWho() {
    const el = $('#who');
    const key = S.me.email + S.me.role + S.me.name;
    if (el.dataset.key === key) return;
    el.dataset.key = key;
    el.replaceChildren(h('b', { text: S.me.name || S.me.email }), h('span', { class: 'pill', text: ROLE_NAME[S.me.role] || S.me.role }));
  }
  function renderInvs() {
    const el = $('#invs');
    const show = S.inventories.length > 1 && S.view !== 'admin' && !(S.view === 'order' && orderMode() === 'list');
    el.hidden = !show;
    if (!show) return;
    const key = S.inventories.map((v) => v.id + ':' + v.name).join('|');
    if (el.dataset.key !== key) {
      el.replaceChildren(...S.inventories.map((v) => h('button', { type: 'button', class: 'inv', 'data-inv': v.id, text: v.name })));
      el.dataset.key = key;
    }
    for (const b of el.children) b.setAttribute('aria-pressed', String(b.dataset.inv === S.inv));
  }
  $('#invs').addEventListener('click', (e) => {
    const b = e.target.closest('.inv');
    if (!b || b.dataset.inv === S.inv) return;
    S.inv = b.dataset.inv;
    S.section = 'all';
    S.keep.clear();
    store.set('inv-current', S.inv);
    render();
  });

  function renderTabs(force) {
    const el = $('#tabs');
    const want = [['count', 'Count', 'list'], ['scan', 'Scan', 'scan']];
    if (can('plan') || can('tick')) want.push(['order', 'Order', 'cart']);
    if (isAdmin()) want.push(['admin', 'Admin', 'gear']);
    const key = want.map((w) => w[0]).join('|');
    if (force || el.dataset.key !== key) {
      el.replaceChildren(...want.map(([v, label, icon]) => v === 'scan'
        ? h('button', { class: 'tab', type: 'button', 'data-tab': 'scan' }, h('span', { class: 'disc', icon }), h('span', { text: label }))
        : h('button', { class: 'tab', type: 'button', 'data-tab': v, 'aria-pressed': 'false', icon },
          h('span', { text: label }), v === 'order' ? h('span', { class: 'badge', hidden: true }) : null)));
      el.dataset.key = key;
    }
    for (const b of el.querySelectorAll('[data-tab]')) if (b.dataset.tab !== 'scan') b.setAttribute('aria-pressed', String(b.dataset.tab === S.view));
    const badge = $('.badge', el);
    if (badge) {
      const n = [...S.items.values()].filter((it) => it.onList && !it.bought).length;
      badge.textContent = String(n);
      badge.hidden = !n;
    }
  }
  $('#tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    if (b.dataset.tab === 'scan') { openScanner({ mode: countingHere() ? 'count' : 'find' }); return; }
    if (S.view === b.dataset.tab) return;
    S.view = b.dataset.tab;
    S.section = 'all';
    S.filter = false;
    S.keep.clear();
    store.set('inv-view', S.view);
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  });

  /* ---------- Count view ---------- */
  const rows = new Map(), groups = new Map();
  function renderCount() {
    const counting = countingHere();
    const oc = openCount(S.inv);
    renderStatus(oc, counting);
    const all = invItems(S.inv);
    const valOf = (it) => (counting ? sessionVal(it.id) : num(it.count));
    const secs = new Map();
    let done = 0;
    for (const it of all) {
      const s = secOf(it);
      let g = secs.get(s);
      if (!g) { g = { total: 0, done: 0, visible: [] }; secs.set(s, g); }
      g.total++;
      const v = valOf(it);
      if (v !== null) { g.done++; done++; }
      const hidden = S.filter && counting && v !== null && !S.keep.has(it.id);
      if ((S.section === 'all' || S.section === s) && matchesSearch(it) && !hidden) g.visible.push(it);
    }
    if (S.section !== 'all' && !secs.has(S.section)) S.section = 'all';
    renderBar({ show: all.length > 0, filterLabel: counting ? 'Hide counted' : '', secs, done, total: all.length, showCounts: counting });

    const list = $('#view-count');
    let anyVisible = false;
    for (const g of secs.values()) if (g.visible.length) { anyVisible = true; break; }
    let empty = $('#count-empty');
    if (!empty) empty = h('div', { class: 'empty', id: 'count-empty' }, h('h2'), h('p'));
    empty.hidden = anyVisible;
    if (!anyVisible) {
      const [t, p] = !S.inventories.length ? ['No inventories', 'You don’t have access to any inventory yet. Ask the admin.']
        : !all.length ? ['No products yet', isAdmin() ? 'Tap “Add product” below to start this inventory.' : 'The admin hasn’t added products here yet.']
          : ['Nothing matches', S.filter ? 'Everything that matches is counted. Turn off “Hide counted” or change the search.' : 'No product matches that search. Try fewer letters.'];
      empty.firstChild.textContent = t;
      empty.lastChild.textContent = p;
    }
    for (const [name, el] of groups) if (!secs.has(name)) { el.remove(); groups.delete(name); }
    for (const [id, li] of rows) if (!S.items.has(id) || S.items.get(id).inventory !== S.inv) { li.remove(); rows.delete(id); }
    const order = [empty];
    for (const [name, g] of secs) {
      let el = groups.get(name);
      if (!el) { el = makeGroup(name); groups.set(name, el); }
      el._meta.textContent = counting ? g.done + ' of ' + g.total + ' counted' : g.total + (g.total === 1 ? ' product' : ' products');
      el._add.hidden = !can('edit');
      el._add.textContent = '+ Add product to ' + name;
      el._add.dataset.section = name === '—' ? '' : name;
      el.hidden = g.visible.length === 0;
      const want = g.visible.map((it) => {
        let li = rows.get(it.id);
        if (!li) { li = makeRow(it.id); rows.set(it.id, li); }
        updateRow(li, it, counting);
        return li;
      });
      syncChildren(el._ul, want);
      order.push(el);
    }
    syncChildren(list, order);
    renderFooter();
  }

  function renderStatus(oc, counting) {
    const el = $('#status');
    const inv = currentInv();
    el.hidden = !inv;
    if (!inv) return;
    const key = JSON.stringify([S.inv, oc, counting, S.me.role, Math.floor(Date.now() / 60000), countProgress(oc)]);
    if (el.dataset.key === key) return;
    el.dataset.key = key;
    el.className = 'status';
    const kids = [];
    if (!oc) {
      if (isAdmin()) {
        kids.push(h('p', { class: 'lead', text: 'No count open in ' + inv.name + '.' }),
          h('p', { class: 'fine', text: 'Open a count to let your counters edit this inventory until the time you choose.' }),
          h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', type: 'button', text: 'Start a count', onclick: () => openCountSheet(inv, null) })));
      } else if (can('count')) {
        kids.push(h('p', { class: 'lead', text: 'Counting is closed.' }), h('p', { class: 'fine', text: 'The admin opens it when it’s time to count.' }));
      } else {
        const last = all(S.inv).map((it) => str(it.countedAt)).sort().pop();
        kids.push(h('p', { class: 'lead', text: 'Stock from the last count' + (last ? ' (' + fmtDay(last) + ')' : '') + '.' }));
      }
    } else {
      const late = isLate(oc);
      const prog = countProgress(oc);
      if (isAdmin()) {
        el.classList.add(late ? 'is-late' : 'is-live');
        const who = oc.counterNames && oc.counterNames.length ? oc.counterNames.join(', ') : 'only admins';
        kids.push(h('p', { class: 'lead', text: late ? 'Count time is up (was until ' + fmtUntil(oc.until) + ').' : 'Count open until ' + fmtUntil(oc.until) + '.' }),
          h('p', { class: 'fine', text: 'Counting: ' + who + ' · ' + prog }),

  const orderView = $('#view-order');

    const m = S.orderMultiple || 1;
    if (t === li._plus) { const q = orderVal(id) || 0; setOrder(id, Math.ceil((q + 1) / m) * m); S.keep.add(id); }
    else if (t === li._minus) { const q = orderVal(id) || 0; setOrder(id, Math.max(0, Math.floor((q - 1) / m) * m)); S.keep.add(id); }

  // Shopping list: everything on the list, grouped by supplier, with a tick for each.
  function listGroupsOf() {
    const map = new Map();
    for (const it of S.items.values()) {
      if (!it.onList) continue;
      const name = str(it.supplier) || str(it.brand) || 'No supplier yet';
      const key = norm(name) + (str(it.supplier) || str(it.brand) ? '' : '~');
      let g = map.get(key);
      if (!g) { g = { key, name, items: [] }; map.set(key, g); }
      g.items.push(it);
    }
    const out = [...map.values()].sort((a, b) => (a.key.endsWith('~') ? 1 : 0) - (b.key.endsWith('~') ? 1 : 0) || collator.compare(a.name, b.name));
    out.forEach((g) => g.items.sort((a, b) => collator.compare(labelOf(a), labelOf(b))));
    return out;
  }
  function renderList(root) {
    $('#bar').hidden = true;
    const gs = listGroupsOf();
    const total = gs.reduce((n, g) => n + g.items.length, 0);
    const bought = gs.reduce((n, g) => n + g.items.filter((it) => it.bought).length, 0);
    root._info.textContent = total ? bought + ' of ' + total + ' bought' + (can('prices') ? ' · prices are per pack' : '') : '';
    if (!root._listTools) {
      const copy = h('button', { class: 'btn primary', type: 'button', text: 'Copy list' });
      const wa = h('a', { class: 'btn', href: 'https://wa.me/', target: '_blank', rel: 'noopener', text: 'Send by WhatsApp' });
      const findBtn = h('button', { class: 'btn', type: 'button', text: 'Find by barcode' });
      copy.addEventListener('click', () => copyText(listText(listGroupsOf()), 'the list'));
      findBtn.addEventListener('click', () => openScanner({ mode: 'find' }));
      root._listTools = [copy, wa, findBtn];
      root._wa = wa;
    }
    root._tools.replaceChildren(...root._listTools);
    root._tools.hidden = !total;
    if (total) root._wa.href = 'https://wa.me/?text=' + encodeURIComponent(listText(gs));
    root._empty.hidden = !!total;
    if (!total) {
      root._empty.firstChild.textContent = 'Nothing to buy';
      root._empty.lastChild.textContent = can('plan') ? 'Add products in Plan, or tap “Fill from min/max”.' : 'The admin hasn’t added anything to the list yet.';
    }
    const live = new Set(gs.map((g) => g.key));
    for (const [k, el] of listGroups) if (!live.has(k)) { el.remove(); listGroups.delete(k); }
    const ids = new Set();
    gs.forEach((g) => g.items.forEach((it) => ids.add(it.id)));
    for (const [id, li] of listRows) if (!ids.has(id)) { li.remove(); listRows.delete(id); }
    const order = [];
    for (const g of gs) {
      let el = listGroups.get(g.key);

      const b = g.items.filter((it) => it.bought).length;
      el._meta.textContent = b + ' of ' + g.items.length;
      syncChildren(el._ul, g.items.map((it) => {

        if (!li) { li = makeListRow(it.id); listRows.set(it.id, li); }
        updateListRow(li, it);
        return li;
      }));
      order.push(el);
    }
    syncChildren(root._list, order);
  }

    if (imgQueue.size) setTimeout(pumpImages, fail ? 5000 : 0);
  }
  const thumbObserver = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      thumbObserver.unobserve(e.target);
      const [id, token] = (e.target.dataset.want || '').split('|');
      if (id && token) wantImage(id, token);
    }
  }, { rootMargin: '300px 0px' }) : null;
  function showThumb(img, id, token, eager) {
    img.hidden = !token;
    if (!token) { img.removeAttribute('src'); delete img.dataset.key; return; }
    const key = imgKey(id, token);
    if (img.dataset.key === key) return;
    const src = imgCache.get(key);
    if (src) {
      img.src = src;
      img.dataset.key = key;
      if (thumbObserver) thumbObserver.unobserve(img);
      return;
    }
    img.removeAttribute('src');
    delete img.dataset.key;
    img.dataset.want = key;
    if (eager || !thumbObserver) wantImage(id, token);
    else thumbObserver.observe(img);
  }
  function jpegFrom(img, maxSide, quality) {
    const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * scale));
    c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality);
  }
  async function makePhotos(file) {
    let img;
    try { img = await loadImage(file); } catch (_) { throw new Error('unreadable'); }
    let preview = jpegFrom(img, PREVIEW_SIDE, 0.7);
    if (preview.length > MAX_PREVIEW_CHARS) preview = jpegFrom(img, 200, 0.6);
    const photo = jpegFrom(img, PHOTO_SIDE, 0.82);
    if (preview.length > MAX_PREVIEW_CHARS || photo.length > MAX_PHOTO_CHARS) throw new Error('unreadable');
    return { preview, photo };
  }
  const filePhoto = $('#file-photo');
  function pickPhoto(id) { S.photoFor = id; filePhoto.click(); }
  filePhoto.addEventListener('change', async () => {
    const file = filePhoto.files && filePhoto.files[0];
    const id = S.photoFor;
    filePhoto.value = '';
    S.photoFor = null;
    if (!file || !id || !S.items.has(id)) return;
    S.photoBusy = id;
    refresh();
    try {
      const photos = await makePhotos(file);
      const item = await write('photoSave', { id, preview: photos.preview, photo: photos.photo });
      imgCache.set(imgKey(id, item.image), photos.preview);
      rememberFull(imgKey(id, item.image), photos.photo);
      applyItem(item);
      toast('Photo saved to Google Drive.');
    } catch (err) {
      if (err && err.message === 'unreadable') toast('That photo couldn’t be read. Try a JPEG or PNG.');
      else failed(err);
    } finally {
      S.photoBusy = null;
      refresh();
    }
  });
  async function removePhoto(id) {
    S.photoBusy = id;
    refresh();
    try { applyItem(await write('photoRemove', { id })); toast('Photo removed.'); }
    catch (err) { failed(err); }
    finally { S.photoBusy = null; refresh(); }
  }
  function rememberFull(key, data) {
    fullCache.set(key, data);
    if (fullCache.size > 6) fullCache.delete(fullCache.keys().next().value);
  }
  async function showPhoto(id) {
    const d = S.items.get(id);
    if (!d || !d.image) return;
    const key = imgKey(id, str(d.image));
    const src = fullCache.get(key) || imgCache.get(key);
    if (!src) return;
    const img = h('img', { class: 'viewer-img', src, alt: 'Photo of ' + labelOf(d) });
    const note = h('p', { class: 'fine', text: 'Loading the full photo…' });
    note.hidden = fullCache.has(key);
    showPanel([h('h2', { text: labelOf(d) }), img, note,
      h('div', { class: 'edit-actions' }, h('button', { class: 'btn', type: 'button', text: 'Back', onclick: () => openItem(id) }))]);
    if (fullCache.has(key)) return;
    try {
      const got = await api('photo', { id });
      if (got && got.data) { rememberFull(imgKey(id, got.token), got.data); img.src = got.data; note.hidden = true; }
      else note.textContent = 'Only the preview is available.';
    } catch (_) { note.textContent = 'Couldn’t load the full photo. Showing the preview.'; }
  }

  /* ======================= Toast ======================= */
  const toastEl = $('#toast'), toastMsg = $('#toast-msg'), toastAct = $('#toast-act');
  let toastT = 0, toastFn = null;
  function toast(msg, opts) {
    const o = opts || {};
    if (!o.undo) undoBuf.length = 0;   // Undo only applies while its own message shows
    toastMsg.textContent = msg;
    toastFn = o.fn || null;
    toastAct.hidden = !o.action;
    toastAct.textContent = o.action || '';
    toastEl.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { toastEl.hidden = true; toastFn = null; undoBuf.length = 0; }, o.ms || (o.action ? 6000 : 3400));
  }
  toastAct.addEventListener('click', () => {
    const fn = toastFn;
    toastFn = null;
    toastEl.hidden = true;
    clearTimeout(toastT);
    if (fn) fn();
  });

  /* ======================= Start ======================= */
  $('#sync-refresh').addEventListener('click', () => load());
  setInterval(() => { if (document.visibilityState === 'visible' && S.loaded && connected()) load(); }, POLL_MS);
  setInterval(() => { if (S.loaded && S.view === 'count') refresh(); }, 30000);   // keeps "until" texts current
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.loaded && connected()) load(); });
  window.addEventListener('beforeunload', (e) => { if (typed.size || queue.length || sending) { typed.forEach((_, id) => commitTyped(id)); e.preventDefault(); } });
  boot();
})();
</script>
